<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ share_meta.title if share_meta else 'OI Profile Dashboard' }}</title>
<meta name="description" content="{{ share_meta.description if share_meta else '' }}">
<!-- Open Graph / share cards -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ share_meta.title if share_meta else 'OI Profile Dashboard' }}">
<meta property="og:description" content="{{ share_meta.description if share_meta else '' }}">
<meta property="og:url" content="{{ share_meta.url if share_meta else '' }}">
<meta property="og:image" content="{{ share_meta.image if share_meta else '' }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ share_meta.title if share_meta else 'OI Profile Dashboard' }}">
<meta name="twitter:description" content="{{ share_meta.description if share_meta else '' }}">
<meta name="twitter:image" content="{{ share_meta.image if share_meta else '' }}">
<script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
<script>window.Chart||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"><\/script>')</script>
<style>
/* ============================================================
   OI PROFILE — Rates Open Interest Dashboard
   Institutional "Wall-Street" restyle, aligned to the
   Futures OI workbook: deep-navy chrome, slate section
   headers, dense tabular grids, per-column blue→white→green
   heat-map. Light, print-clean, high-contrast.
   ============================================================ */
:root{
  --bg:#eceff4;
  --panel:#ffffff;
  --ink:#17233b;          /* primary text / headings */
  --ink-soft:#43536e;     /* secondary text */
  --muted:#7b8aa1;        /* tertiary */
  --navy:#1b2c47;         /* title bar */
  --navy-2:#26436c;       /* title bar gradient end */
  --slate:#3f577c;        /* section header bars */
  --slate-2:#4f6b96;      /* mid slate */
  --slate-hd:#41597f;     /* column header row */
  --line:#d7dce5;         /* gridlines */
  --line-strong:#595959;  /* pack separators */
  --row-alt:#f4f6fa;      /* zebra */
  --chip:#e7ecf3;
  --pos:#1f9d6b;          /* up (green) */
  --neg:#cf3f38;          /* down (red) */
  --blue:#2f6fb0;         /* heat negative side */
  --green:#1f9d6b;        /* heat positive side */
  --accent:#3d7bd1;
  --shadow:0 1px 2px rgba(20,32,55,.06), 0 6px 22px rgba(20,32,55,.08);
  --mono:"SF Mono",ui-monospace,"Roboto Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:13px;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1,"cv01" 1;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- Title bar ---------- */
header.topbar{
  background:linear-gradient(100deg,var(--navy) 0%,var(--navy-2) 100%);
  color:#fff;
  padding:14px 24px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  border-bottom:3px solid #0f1b2e;
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand .l1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{
  font-size:20px;font-weight:800;letter-spacing:.14em;margin:0;
  text-transform:uppercase;color:#eaf1fb;
}
.brand .sub{
  font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:#8fb0d8;
}
.brand .meta{
  font-size:11.5px;color:#a9c1de;font-style:italic;letter-spacing:.02em;
  display:flex;gap:14px;flex-wrap:wrap;margin-top:2px;
}
.brand .meta b{color:#e7f0fb;font-style:normal;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.livedot{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:#bcd2ec}
.livedot i{width:9px;height:9px;border-radius:50%;background:#4fd18a;
  box-shadow:0 0 0 0 rgba(79,209,138,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,209,138,.55)}70%{box-shadow:0 0 0 9px rgba(79,209,138,0)}100%{box-shadow:0 0 0 0 rgba(79,209,138,0)}}
.btn{
  font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;border-radius:6px;border:1px solid transparent;
  padding:8px 14px;transition:.15s;white-space:nowrap;
}
.btn-refresh{background:#12508a;color:#eaf2fb;border-color:#2f6aa5}
.btn-refresh:hover{background:#1b64a9}
.btn-refresh:active{transform:translateY(1px)}

/* ---------- Control strip ---------- */
.controls{
  background:#dbe2ec;border-bottom:1px solid #c3ccda;
  padding:0 20px;display:flex;align-items:stretch;justify-content:space-between;
  gap:16px;flex-wrap:wrap;position:sticky;top:57px;z-index:30;
}
.tabs{display:flex;gap:0;overflow-x:auto}
.tab{
  appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);
  padding:13px 16px 11px;border-bottom:3px solid transparent;white-space:nowrap;transition:.12s;
}
.tab:hover{color:var(--navy);background:rgba(255,255,255,.45)}
.tab.active{color:var(--navy);border-bottom-color:var(--navy);background:rgba(255,255,255,.7)}
.viewtoggle{display:flex;align-items:center;gap:8px;padding:8px 0}
.seg{display:inline-flex;background:#c7d0dd;border-radius:8px;padding:3px}
.seg button{
  appearance:none;border:0;background:transparent;cursor:pointer;border-radius:6px;
  font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:#43536e;padding:7px 14px;transition:.12s;white-space:nowrap;
}
.seg button.active{background:var(--navy);color:#fff;box-shadow:0 1px 3px rgba(20,32,55,.25)}
.seg.small button{padding:5px 12px;font-size:11px}

/* ---------- Main ---------- */
main{padding:20px;max-width:1420px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.card-hd{
  background:linear-gradient(180deg,var(--slate) 0%,#374d70 100%);
  color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.card-hd .t{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.card-hd .t small{font-weight:600;letter-spacing:.1em;color:#c9d7ec;margin-left:8px}
.card-hd .r{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#c4d3e8;font-weight:600}

/* ---------- Heat-map / data table ---------- */
.tbl-wrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;font-size:12px}
table.grid th,table.grid td{border:1px solid var(--line);padding:5px 8px;white-space:nowrap}
table.grid thead th{
  background:#e9edf3;color:var(--ink-soft);font-weight:700;font-size:10.5px;
  letter-spacing:.07em;text-transform:uppercase;position:sticky;top:0;
  border-color:#cfd6e1;text-align:right;
}
table.grid thead th.grp{
  background:#41597f;color:#eaf1fb;text-align:center;letter-spacing:.12em;
  border-color:#31456a;
}
table.grid thead th.lbl{text-align:left}
table.grid td.lbl{
  text-align:left;font-weight:700;color:var(--ink);background:#fbfcfe;
  position:sticky;left:0;z-index:2;border-right:2px solid #cfd6e1;
}
table.grid td.num{text-align:right}
table.grid tbody tr:nth-child(even) td:not(.lbl){background:var(--row-alt)}
table.grid tbody tr:hover td{background:#eef3fb}
table.grid tbody tr:hover td.lbl{background:#eef3fb}
td.latest{font-weight:800;color:var(--ink);background:#f0f4fa !important;border-left:2px solid #cfd6e1;border-right:2px solid #cfd6e1}
tr.pack-sep td{border-bottom:2px solid var(--line-strong)}
tr.total td{background:#e4e9f1 !important;font-weight:800;color:var(--navy);
  border-top:2px solid #9fb0c8}
td.pack-label{background:#eef1f6 !important;color:var(--slate);font-weight:800;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-align:left}
table.grid th.sepL,table.grid td.sepL{border-left:2px solid #aeb9ca}
.delta-chip{display:inline-block;min-width:52px;text-align:right;font-family:var(--mono);
  font-size:11px;font-weight:700}
.up{color:var(--pos)} .down{color:var(--neg)} .flat{color:var(--muted)}
.spark{display:block}
.contract-sub{font-weight:600;color:var(--muted);font-size:10.5px;margin-left:6px}

/* ---------- legend ---------- */
.legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 16px;border-top:1px solid var(--line);background:#fafbfd;
  font-size:11px;color:var(--ink-soft)}
.legend .ramp{display:inline-flex;height:12px;width:150px;border-radius:3px;overflow:hidden;
  border:1px solid #cfd6e1;background:linear-gradient(90deg,#2f6fb0,#eef2f7 50%,#1f9d6b)}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend b{color:var(--ink)}

/* ---------- Series ---------- */
.series-tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 16px;
  border-bottom:1px solid var(--line);background:#fafbfd}
.chart-box{padding:16px;height:520px}
.series-tools label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:700}
select.pick{font-family:var(--sans);font-size:12px;padding:6px 10px;border:1px solid #c3ccda;
  border-radius:6px;background:#fff;color:var(--ink)}

/* ---------- Pre vs Final ---------- */
.pvf-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn-ghost{background:#eef2f8;border:1px solid #c3ccda;color:var(--ink-soft)}
.btn-ghost:hover{background:#e2e9f3;color:var(--navy)}
.pvf-note{padding:10px 16px;font-size:11.5px;color:var(--ink-soft);background:#fafbfd;
  border-top:1px solid var(--line)}
.pvf-market-hd td{background:#eef1f6 !important;color:var(--slate);font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;font-size:10.5px}

/* ---------- misc ---------- */
.loading,.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}
.tip{position:fixed;pointer-events:none;z-index:100;background:var(--navy);color:#eaf1fb;
  font-size:11.5px;padding:8px 10px;border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.28);
  opacity:0;transition:opacity .1s;max-width:260px;line-height:1.5}
.tip b{color:#fff}
.tip .k{color:#8fb0d8}
footer{padding:8px 24px 26px;text-align:center;color:var(--muted);font-size:11px}
footer a{color:var(--accent);text-decoration:none}
@media (max-width:640px){
  .brand h1{font-size:16px;letter-spacing:.1em}
  main{padding:12px}
  .card-hd .t{font-size:11px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="l1">
      <h1>OI&nbsp;Profile</h1>
      <span class="sub">Open&nbsp;Interest&nbsp;Dashboard</span>
    </div>
    <div class="meta">
      <span>As of <b id="m-date">—</b></span>
      <span><b id="m-mkts">—</b> markets</span>
      <span><b id="m-contracts">—</b> contracts</span>
      <span>Updated <b id="m-updated">—</b></span>
    </div>
  </div>
  <div class="topbar-right">
    <span class="livedot"><i></i> Live</span>
    <button class="btn btn-refresh" id="btn-refresh">↻ Refresh</button>
  </div>
</header>

<div class="controls">
  <div class="tabs" id="tabs"></div>
  <div class="viewtoggle">
    <div class="seg" id="seg">
      <button data-v="heatmap" class="active">▦ Heat-map</button>
      <button data-v="series">📈 Series</button>
      <button data-v="pvf">◈ Pre vs Final</button>
    </div>
  </div>
</div>

<main id="content">
  <div class="loading">Loading open-interest data…</div>
</main>

<footer>
  Rates open-interest profiles · SR3 · Fed Funds · Treasuries · Euribor · SONIA · Brazil · CORRA
  &nbsp;·&nbsp; auto-refreshes from the published workbook
</footer>

<div class="tip" id="tip"></div>

<script>
/* ============================ STATE ============================ */
const S = { markets:{}, order:[], active:null, view:'heatmap', pvf:null, charts:[] };
const COLS = 12;                 // recent trading days shown in heat-map
const MARKET_LABELS = {
  SR3:'SOFR 3-Month · SR3', FF:'Fed Funds 30-Day · ZQ / FF',
  treasuries:'US Treasury Futures', ER:'Euribor 3-Month · ER',
  SONIA:'SONIA 3-Month · SFI', Brazil:'Brazil DI1', CORRA:'CORRA 3-Month · CRA'
};
const STIR = new Set(['SR3','ER','SONIA','CORRA','FF']);   // pack-separated chains

/* ============================ HELPERS ============================ */
const $ = s => document.querySelector(s);
function fmtOI(v){
  if(v===null||v===undefined||v==='') return '·';
  const n=Number(v); if(!isFinite(n)) return '·';
  const a=Math.abs(n);
  if(a>=1e6) return (n/1e6).toFixed(2)+'M';
  if(a>=1e3) return (n/1e3).toFixed(a>=1e5?0:1)+'K';
  return String(Math.round(n));
}
function fmtSigned(v){
  if(v===null||v===undefined||!isFinite(v)) return '·';
  const s=v>0?'+':(v<0?'−':'');
  return s+fmtOI(Math.abs(v));
}
function pct(a,b){ if(a===null||b===null||b===0||a===undefined||b===undefined) return null; return (a-b)/Math.abs(b)*100; }
function parseD(s){ // dd/mm/yy -> Date
  const m=/^(\d{2})\/(\d{2})\/(\d{2})$/.exec(String(s)); if(!m) return null;
  return new Date(2000+ +m[3], +m[2]-1, +m[1]);
}
function heatColor(t){ // t in [-1,1] : blue(neg) -> white -> green(pos)
  if(t===null||!isFinite(t)) return 'transparent';
  if(Math.abs(t)<0.04) return 'transparent';
  if(t>0){ const a=Math.min(1,t); return `rgba(31,157,107,${(0.10+0.6*a).toFixed(3)})`; }
  const a=Math.min(1,-t); return `rgba(47,111,176,${(0.10+0.6*a).toFixed(3)})`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================ DATA ============================ */
async function fetchData(){
  try{
    const r = await fetch('/api/dashboard-data',{cache:'no-store'});
    if(!r.ok) throw new Error('no data');
    const d = await r.json();
    S.markets = d.markets||{}; S.order = d.market_order||[];
    if(!S.active || !S.markets[S.active]) S.active = S.order[0]||null;
    $('#m-date').textContent = d.latest_date||'—';
    $('#m-mkts').textContent = d.markets_count ?? S.order.length;
    $('#m-contracts').textContent = d.contracts_count ?? '—';
    $('#m-updated').textContent = fmtUpdated(d.updated_at);
    buildTabs(); render();
  }catch(e){
    $('#content').innerHTML = '<div class="card"><div class="empty">No data published yet. Once a workbook is uploaded on the admin panel it appears here automatically.</div></div>';
  }
}
function fmtUpdated(iso){
  if(!iso) return '—';
  try{ const d=new Date(iso); return d.toLocaleString(undefined,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
async function ensurePvf(){
  if(S.pvf!==null) return S.pvf;
  try{ const r=await fetch('/api/pre-vs-final',{cache:'no-store'}); S.pvf = r.ok ? await r.json() : {error:true}; }
  catch(e){ S.pvf={error:true}; }
  return S.pvf;
}

/* ============================ CHROME ============================ */
function buildTabs(){
  const box=$('#tabs'); box.innerHTML='';
  S.order.forEach(m=>{
    const b=document.createElement('button');
    b.className='tab'+(m===S.active?' active':'');
    b.textContent=(m==='treasuries')?'Treasuries':m;
    b.onclick=()=>{ S.active=m; buildTabs(); render(); };
    box.appendChild(b);
  });
}
function setView(v){
  S.view=v;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  render();
}
function killCharts(){ S.charts.forEach(c=>{try{c.destroy()}catch(e){}}); S.charts=[]; }

/* ============================ RENDER ROUTER ============================ */
function render(){
  killCharts();
  const c=$('#content');
  if(!S.active){ c.innerHTML='<div class="card"><div class="empty">No markets available.</div></div>'; return; }
  if(S.view==='heatmap') renderHeatmap(c);
  else if(S.view==='series') renderSeries(c);
  else renderPvf(c);
}

/* ============================ HEAT-MAP ============================ */
function renderHeatmap(c){
  const mk=S.markets[S.active]; if(!mk){c.innerHTML='';return;}
  const dates=mk.dates||[];                          // newest-first
  const contracts=mk.contracts||[];
  const latestD=dates[0];
  // change horizons in trading-day offsets — mirrors the Futures OI summary (1D…4W)
  const HZ=[['1D',1],['3D',3],['1W',5],['2W',10],['3W',15],['4W',20],['2M',42],['3M',63]];
  const chNum={}, chPct={};
  const maxN=HZ.map(()=>0), maxP=HZ.map(()=>0);
  contracts.forEach(ct=>{
    const cur=mk.data[ct]?.[latestD];
    chNum[ct]=HZ.map(([,off],i)=>{
      const past=mk.data[ct]?.[dates[off]];
      if(cur==null||past==null) return null;
      const d=cur-past; if(Math.abs(d)>maxN[i]) maxN[i]=Math.abs(d); return d;
    });
    chPct[ct]=HZ.map(([,off],i)=>{
      const p=pct(cur, mk.data[ct]?.[dates[off]]);
      if(p!==null && Math.abs(p)>maxP[i]) maxP[i]=Math.abs(p); return p;
    });
  });
  // header — two segregated blocks: Δ (#) and Δ (%)
  let h='<div class="card"><div class="card-hd"><div class="t">'+esc(MARKET_LABELS[S.active]||S.active)+
        '<small>Open-Interest change · vs prior sessions</small></div>'+
        '<div class="r">colour = Δ OI · green rising · blue falling</div></div><div class="tbl-wrap"><table class="grid"><thead>';
  h+='<tr><th class="lbl" rowspan="2">Contract</th><th class="lbl" rowspan="2">Trend</th>'+
     '<th rowspan="2">Latest OI</th>'+
     '<th class="grp sepL" colspan="'+HZ.length+'">Δ Open Interest&nbsp;(#)</th>'+
     '<th class="grp sepL" colspan="'+HZ.length+'">Δ Open Interest&nbsp;(%)</th></tr><tr>';
  HZ.forEach(([lab],i)=>h+='<th'+(i===0?' class="sepL"':'')+'>'+lab+'</th>');
  HZ.forEach(([lab],i)=>h+='<th'+(i===0?' class="sepL"':'')+'>'+lab+'</th>');
  h+='</tr></thead><tbody>';
  contracts.forEach((ct,ri)=>{
    const latest=mk.data[ct]?.[latestD];
    const sepClass=(STIR.has(S.active) && (ri+1)%4===0 && ri<contracts.length-1)?'pack-sep':'';
    h+='<tr class="'+sepClass+'">';
    h+='<td class="lbl">'+esc(ct)+'</td>';
    h+='<td class="num">'+sparkline(ct,mk,dates)+'</td>';
    h+='<td class="latest num">'+fmtOI(latest)+'</td>';
    // Δ (#) block
    chNum[ct].forEach((d,i)=>{
      const t=(d===null||maxN[i]===0)?null:d/maxN[i];
      const cls=d<0?'down':'';
      const tip=esc(ct+' · Δ'+HZ[i][0]+' (#)\n'+(d===null?'—':fmtSigned(d)+' contracts vs '+(dates[HZ[i][1]]||'—')));
      h+='<td class="num '+cls+(i===0?' sepL':'')+'" style="background:'+heatColor(t)+'" data-tip="'+tip+'">'+(d===null?'·':fmtSigned(d))+'</td>';
    });
    // Δ (%) block
    chPct[ct].forEach((p,i)=>{
      const t=(p===null||maxP[i]===0)?null:p/maxP[i];
      const cls=p<0?'down':'';
      const tip=esc(ct+' · Δ'+HZ[i][0]+' (%)\n'+(p===null?'—':(p>0?'+':'')+p.toFixed(2)+'% vs '+(dates[HZ[i][1]]||'—')));
      h+='<td class="num '+cls+(i===0?' sepL':'')+'" style="background:'+heatColor(t)+'" data-tip="'+tip+'">'+(p===null?'·':(p>0?'+':'')+p.toFixed(1)+'%')+'</td>';
    });
    h+='</tr>';
  });
  // TOTAL row — summed OI change per horizon (heat-map excluded)
  let sumNow=0; contracts.forEach(ct=>{const a=mk.data[ct]?.[latestD]; if(a!=null) sumNow+=+a;});
  const tot=HZ.map(([,off])=>{let sn=0,sp=0,any=false;
    contracts.forEach(ct=>{const a=mk.data[ct]?.[latestD],b=mk.data[ct]?.[dates[off]];
      if(a!=null&&b!=null){sn+=+a;sp+=+b;any=true;}});
    return any?{d:sn-sp,p:sp!==0?(sn-sp)/Math.abs(sp)*100:null}:{d:null,p:null};});
  h+='<tr class="total"><td class="lbl">TOTAL</td><td></td><td class="num">'+fmtOI(sumNow)+'</td>';
  tot.forEach((x,i)=>h+='<td class="num '+(x.d<0?'down':'')+(i===0?' sepL':'')+'">'+(x.d===null?'·':fmtSigned(x.d))+'</td>');
  tot.forEach((x,i)=>h+='<td class="num '+(x.p<0?'down':'')+(i===0?' sepL':'')+'">'+(x.p===null?'·':(x.p>0?'+':'')+x.p.toFixed(1)+'%')+'</td>');
  h+='</tr>';
  h+='</tbody></table></div>';
  h+='<div class="legend"><span class="lg"><b>Heat-map</b></span>'+
     '<span class="lg">OI falling <span class="ramp"></span> OI rising</span>'+
     '<span class="lg" style="color:var(--muted)">each column scaled on its own · white ≈ unchanged</span>'+
     '<span class="lg" style="color:var(--muted)">horizons = 1D / 3D / 1W / 2W / 3W / 4W / 2M / 3M sessions · negatives in <span class="down">red</span></span></div>';
  h+='</div>';
  c.innerHTML=h;
  wireTips();
}

function sparkline(ct,mk,allDates){
  // chronological OI series (oldest -> newest), last ~30 points
  const ds=[...allDates].reverse().slice(-30);
  const pts=ds.map(d=>mk.data[ct]?.[d]).filter(v=>v!==null&&v!==undefined).map(Number);
  if(pts.length<2) return '';
  const w=88,hgt=22,pad=2;
  const mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1;
  const step=(w-2*pad)/(pts.length-1);
  const path=pts.map((v,i)=>(pad+i*step).toFixed(1)+','+(pad+(hgt-2*pad)*(1-(v-mn)/rg)).toFixed(1)).join(' ');
  const up=pts[pts.length-1]>=pts[0];
  const col=up?'#1f9d6b':'#cf3f38';
  return '<svg class="spark" width="'+w+'" height="'+hgt+'" viewBox="0 0 '+w+' '+hgt+'">'+
    '<polyline fill="none" stroke="'+col+'" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" points="'+path+'"/>'+
    '<circle cx="'+(pad+(pts.length-1)*step).toFixed(1)+'" cy="'+(pad+(hgt-2*pad)*(1-(pts[pts.length-1]-mn)/rg)).toFixed(1)+'" r="1.9" fill="'+col+'"/></svg>';
}

/* ============================ SERIES ============================ */
const SERIES_PALETTE=['#1b2c47','#2f6fb0','#1f9d6b','#c98a1f','#8e5bd0','#cf3f38',
  '#0f8a8a','#6b7a90','#b0417a','#3d7bd1','#6a9a2f','#d06a1f'];
function fmtDateShort(s){const d=parseD(s);return d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):s;}
function fmtDateLong(s){const d=parseD(s);return d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}):s;}

// vertical crosshair on hover
const crosshairPlugin={id:'crosshair',afterDatasetsDraw(chart){
  const a=chart.tooltip&&chart.tooltip._active;
  if(a&&a.length){
    const x=a[0].element.x,{top,bottom}=chart.chartArea,cx=chart.ctx;
    cx.save();cx.beginPath();cx.moveTo(x,top);cx.lineTo(x,bottom);
    cx.lineWidth=1;cx.setLineDash([4,4]);cx.strokeStyle='rgba(27,44,71,.30)';cx.stroke();cx.restore();
  }
}};

function seriesDatasets(mk,contracts,dates,N,mode){
  return contracts.slice(0,N).map((ct,i)=>{
    const col=SERIES_PALETTE[i%SERIES_PALETTE.length];
    const raw=dates.map(d=>{const v=mk.data[ct]?.[d];return v==null?null:Number(v);});
    let data=raw;
    if(mode==='pct'){ let base=null; for(const v of raw){ if(v!=null){base=v;break;} }
      data=raw.map(v=>(v==null||base==null||base===0)?null:(v-base)/base*100); }
    return { label:ct, data, borderColor:col, backgroundColor:col,
      borderWidth:2, tension:.35, cubicInterpolationMode:'monotone', spanGaps:true,
      pointRadius:(ctx)=>{let li=-1;const a=ctx.dataset.data;for(let k=a.length-1;k>=0;k--){if(a[k]!=null){li=k;break;}}return ctx.dataIndex===li?3.2:0;},
      pointBackgroundColor:col, pointBorderColor:'#fff', pointBorderWidth:1.6,
      pointHoverRadius:5, pointHoverBorderColor:'#fff', pointHoverBorderWidth:2 };
  });
}
function renderSeries(c){
  const mk=S.markets[S.active]; if(!mk){c.innerHTML='';return;}
  if(!S.seriesMode) S.seriesMode='pct';
  const mode=S.seriesMode, isPct=(mode==='pct');
  const contracts=mk.contracts||[];
  const dates=[...(mk.dates||[])].reverse();     // chronological (oldest→newest)
  const labels=dates.slice();
  const N=Math.min(contracts.length,12);
  const datasets=seriesDatasets(mk,contracts,dates,N,mode);
  c.innerHTML='<div class="card"><div class="card-hd"><div class="t">'+esc(MARKET_LABELS[S.active]||S.active)+
    '<small>Open-Interest '+(isPct?'relative change':'levels')+'</small></div><div class="r">front '+N+' contracts · '+labels.length+' sessions</div></div>'+
    '<div class="series-tools"><div class="seg small" id="ser-mode">'+
      '<button data-m="pct"'+(isPct?' class="active"':'')+'>% Change</button>'+
      '<button data-m="level"'+(!isPct?' class="active"':'')+'>Levels</button></div>'+
      '<label>'+(isPct?'Each contract indexed to the start of the window (0%) — shows how positioning has actually moved.':'Absolute open interest, in contracts.')+' Hover for a cross-section · click the legend to show / hide a line.</label>'+
    '</div>'+
    '<div class="chart-box"><canvas id="ser"></canvas></div></div>';
  const ctx=$('#ser').getContext('2d');
  const chart=new Chart(ctx,{type:'line',data:{labels,datasets},plugins:[crosshairPlugin],options:{
    responsive:true,maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    layout:{padding:{top:8,right:16,bottom:2,left:2}},
    elements:{line:{borderJoinStyle:'round',capBezierPoints:true}},
    plugins:{
      legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',boxWidth:8,boxHeight:8,
        padding:15,font:{size:11},color:'#43536e',
        generateLabels(ch){const items=Chart.defaults.plugins.legend.labels.generateLabels(ch);
          items.forEach(it=>{const ds=ch.data.datasets[it.datasetIndex];const arr=ds.data;
            let last=null;for(let k=arr.length-1;k>=0;k--){if(arr[k]!=null){last=arr[k];break;}}
            it.text=ds.label+'  ·  '+(isPct?(last==null?'·':(last>0?'+':'')+last.toFixed(1)+'%'):fmtOI(last));});
          return items;}}},
      tooltip:{enabled:true,backgroundColor:'rgba(23,35,59,.97)',titleColor:'#fff',bodyColor:'#dbe6f5',
        borderColor:'#31456a',borderWidth:1,padding:{top:10,bottom:10,left:12,right:12},
        cornerRadius:8,titleFont:{size:12,weight:'700'},bodyFont:{size:11.5},boxPadding:5,
        usePointStyle:true,itemSort:(a,b)=>b.parsed.y-a.parsed.y,
        callbacks:{title:(items)=>items.length?fmtDateLong(items[0].label):'',
          label:(x)=>'  '+x.dataset.label+'   '+(isPct?((x.parsed.y>0?'+':'')+x.parsed.y.toFixed(2)+'%'):fmtOI(x.parsed.y))}}
    },
    scales:{
      x:{grid:{display:false},border:{color:'#c7cfdb'},
        ticks:{color:'#7b8aa1',font:{size:10.5},maxTicksLimit:9,autoSkip:true,maxRotation:0,
          callback(v){return fmtDateShort(this.getLabelForValue(v));}}},
      y:{grace:isPct?'6%':'8%',
        grid:{color:(cx)=>(isPct&&cx.tick&&cx.tick.value===0)?'#9aa8bd':'#eaedf3',
              lineWidth:(cx)=>(isPct&&cx.tick&&cx.tick.value===0)?1.4:1},
        border:{display:false},
        title:{display:true,text:isPct?'Change since start of window (%)':'Open Interest (contracts)',color:'#7b8aa1',font:{size:10.5,weight:'700'}},
        ticks:{color:'#7b8aa1',font:{size:10.5},padding:6,callback:v=>isPct?((v>0?'+':'')+v+'%'):fmtOI(v)}}
    }
  }});
  S.charts.push(chart);
  const mb=document.querySelector('#ser-mode');
  if(mb) mb.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.seriesMode=b.dataset.m;render();});
}

/* ============================ PRE vs FINAL ============================ */
async function renderPvf(c){
  c.innerHTML='<div class="card"><div class="loading">Loading pre-vs-final snapshot…</div></div>';
  const p=await ensurePvf();
  if(!p||p.error){
    c.innerHTML='<div class="card"><div class="card-hd"><div class="t">Pre vs Final</div></div>'+
      '<div class="empty">No pre-vs-final snapshot yet. It is captured automatically the next time a <b>Final&nbsp;OI</b> workbook is published — the prior figures become “Pre”, the new ones “Final”.</div></div>';
    return;
  }
  const order=p.market_order||[];
  const pre=p.pre?.markets||{}, fin=p.final?.markets||{};
  let h='<div class="card"><div class="card-hd"><div class="t">Pre vs Final Open Interest'+
        '<small>rates markets · settlement revision</small></div>'+
        '<div class="pvf-actions"><button class="btn btn-ghost" id="pvf-copy">⧉ Copy</button>'+
        '<button class="btn btn-ghost" id="pvf-png">⭳ PNG</button></div></div>';
  h+='<div class="tbl-wrap"><table class="grid" id="pvf-tbl"><thead><tr>'+
     '<th class="lbl">Contract</th><th>Pre OI</th><th>Final OI</th><th>Δ</th><th>Δ&nbsp;%</th></tr></thead><tbody>';
  order.forEach(m=>{
    h+='<tr class="pvf-market-hd"><td colspan="5">'+esc(MARKET_LABELS[m]||m)+'</td></tr>';
    const ks=new Set([...Object.keys(pre[m]||{}),...Object.keys(fin[m]||{})]);
    [...ks].forEach(ct=>{
      const a=pre[m]?.[ct], b=fin[m]?.[ct];
      const d=(a!==null&&a!==undefined&&b!==null&&b!==undefined)?b-a:null;
      const pc=pct(b,a);
      const cls=d>0?'up':(d<0?'down':'flat');
      h+='<tr><td class="lbl">'+esc(ct)+'</td><td class="num">'+fmtOI(a)+'</td><td class="num">'+fmtOI(b)+'</td>'+
         '<td class="num '+cls+'">'+(d===null?'·':fmtSigned(d))+'</td>'+
         '<td class="num '+cls+'">'+(pc===null?'·':(pc>0?'+':'')+pc.toFixed(1)+'%')+'</td></tr>';
    });
  });
  h+='</tbody></table></div>';
  h+='<div class="pvf-note">Pre snapshot: <b>'+esc(p.pre?.snapshot_date||'—')+'</b> · Final snapshot: <b>'+esc(p.final?.snapshot_date||'—')+'</b>. '+
     'Positive Δ = OI added between the pre and final prints.</div></div>';
  c.innerHTML=h;
  $('#pvf-png').onclick=()=>exportPvfPng(p,order,pre,fin);
  $('#pvf-copy').onclick=()=>copyPvf(order,pre,fin);
}

function copyPvf(order,pre,fin){
  let lines=['Contract\tPre\tFinal\tDelta\tDelta%'];
  order.forEach(m=>{
    lines.push(m);
    const ks=new Set([...Object.keys(pre[m]||{}),...Object.keys(fin[m]||{})]);
    [...ks].forEach(ct=>{
      const a=pre[m]?.[ct],b=fin[m]?.[ct];const d=(a!=null&&b!=null)?b-a:'';const pc=pct(b,a);
      lines.push([ct,a??'',b??'',d,pc===null?'':pc.toFixed(1)+'%'].join('\t'));
    });
  });
  navigator.clipboard?.writeText(lines.join('\n')).then(()=>flash('#pvf-copy','✓ Copied'));
}
function flash(sel,txt){const b=$(sel);const o=b.textContent;b.textContent=txt;setTimeout(()=>b.textContent=o,1400);}

function exportPvfPng(p,order,pre,fin){
  const rowH=22, padX=18, headH=92, W=560;
  let rows=0; order.forEach(m=>{rows+=1+new Set([...Object.keys(pre[m]||{}),...Object.keys(fin[m]||{})]).size;});
  const H=headH+rows*rowH+40, sc=2;
  const cv=document.createElement('canvas'); cv.width=W*sc; cv.height=H*sc;
  const x=cv.getContext('2d'); x.scale(sc,sc);
  x.fillStyle='#ffffff'; x.fillRect(0,0,W,H);
  // header
  x.fillStyle='#1b2c47'; x.fillRect(0,0,W,58);
  x.fillStyle='#eaf1fb'; x.font='800 18px Inter,Segoe UI,system-ui,sans-serif';
  x.fillText('OI PROFILE — PRE vs FINAL',padX,26);
  x.fillStyle='#8fb0d8'; x.font='italic 11px Inter,Segoe UI,system-ui,sans-serif';
  x.fillText('Pre '+(p.pre?.snapshot_date||'—')+'   ·   Final '+(p.final?.snapshot_date||'—'),padX,44);
  // col header
  const cx=[padX,260,350,440,510];
  x.fillStyle='#41597f'; x.fillRect(0,58,W,26);
  x.fillStyle='#eaf1fb'; x.font='700 10.5px Inter,Segoe UI,system-ui,sans-serif';
  x.fillText('CONTRACT',cx[0],75); ['PRE','FINAL','Δ','Δ%'].forEach((t,i)=>{x.textAlign='right';x.fillText(t,cx[i+1]+34,75);x.textAlign='left';});
  let y=headH;
  order.forEach(m=>{
    x.fillStyle='#eef1f6'; x.fillRect(0,y-14,W,rowH);
    x.fillStyle='#3f577c'; x.font='800 10px Inter,sans-serif';
    x.fillText((MARKET_LABELS[m]||m).toUpperCase(),padX,y);
    y+=rowH;
    const ks=new Set([...Object.keys(pre[m]||{}),...Object.keys(fin[m]||{})]);
    let alt=false;
    [...ks].forEach(ct=>{
      if(alt){x.fillStyle='#f4f6fa';x.fillRect(0,y-14,W,rowH);} alt=!alt;
      const a=pre[m]?.[ct],b=fin[m]?.[ct];const d=(a!=null&&b!=null)?b-a:null;const pc=pct(b,a);
      x.fillStyle='#17233b'; x.font='700 11px Inter,sans-serif'; x.fillText(ct,cx[0],y);
      x.font='11px "SF Mono",Roboto Mono,monospace'; x.textAlign='right';
      x.fillStyle='#43536e'; x.fillText(fmtOI(a),cx[1]+34,y); x.fillText(fmtOI(b),cx[2]+34,y);
      x.fillStyle=d>0?'#1f9d6b':(d<0?'#cf3f38':'#7b8aa1');
      x.fillText(d===null?'·':fmtSigned(d),cx[3]+34,y);
      x.fillText(pc===null?'·':(pc>0?'+':'')+pc.toFixed(1)+'%',cx[4]+34,y);
      x.textAlign='left';
      y+=rowH;
    });
  });
  cv.toBlob(bl=>{const u=URL.createObjectURL(bl);const a=document.createElement('a');
    a.href=u;a.download='OI_pre_vs_final_'+(p.final?.snapshot_date||'').replace(/\//g,'-')+'.png';a.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000); flash('#pvf-png','✓ Saved');});
}

/* ============================ TOOLTIPS ============================ */
const tip=$('#tip');
function wireTips(){
  document.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mouseenter',e=>{tip.innerHTML=esc(el.getAttribute('data-tip')).replace(/\n/g,'<br>');tip.style.opacity='1';});
    el.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';});
    el.addEventListener('mouseleave',()=>{tip.style.opacity='0';});
  });
}

/* ============================ BOOT ============================ */
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('#btn-refresh').onclick=()=>{S.pvf=null;fetchData();};
fetchData();
setInterval(fetchData, 5*60*1000);   // auto-refresh every 5 min
</script>
