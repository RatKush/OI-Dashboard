<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OI Profile</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root {
  --bg:      #10161f;
  --panel:   #181f2d;
  --panel2:  #1c2438;
  --panel3:  #202840;
  --border:  #2e3f58;
  --border2: #3a5070;
  --accent:  #4db8ff;
  --accent2: #50e890;
  --warn:    #ffd44d;
  --text:    #ffffff;
  --text2:   #dce8f8;
  --dim:     #7a95b8;
  --dim2:    #9ab0cc;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans', sans-serif;
  font-size:14px;
  font-weight:400;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

.app { position:relative; }

/* ─── HEADER ─── */
header {
  display:flex; align-items:center; gap:18px; padding:12px 22px;
  background:#141b28;
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100;
  flex-wrap:wrap;
}
.logo {
  font-family:'IBM Plex Mono', monospace;
  font-size:16px; font-weight:600;
  color:var(--accent); letter-spacing:2px; white-space:nowrap;
}
.hdr-meta { display:flex; gap:24px; align-items:center; }
.hdr-stat {
  display:flex; flex-direction:column;
  font-family:'IBM Plex Mono', monospace;
  font-size:10px; color:var(--dim); line-height:1.5;
}
.hdr-stat b { color:var(--text); font-size:13px; font-weight:600; }
.hdr-right { display:flex; gap:10px; align-items:center; margin-left:auto; }
.published-at {
  display:flex; flex-direction:column; align-items:flex-end;
  gap:1px; font-family:'IBM Plex Mono', monospace;
  line-height:1.2; white-space:nowrap;
}
.published-at span { color:var(--dim); font-size:9px; letter-spacing:.8px; }
.published-at b    { color:var(--text2); font-size:11px; font-weight:600; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--border2); flex-shrink:0; transition:.3s; }
.dot.live { background:var(--accent2); box-shadow:0 0 8px var(--accent2); animation:pulse 2s infinite; }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.btn {
  padding:7px 18px; border:1px solid var(--accent); background:transparent;
  color:var(--accent); font-family:'IBM Plex Sans',sans-serif;
  font-weight:600; font-size:13px; cursor:pointer; letter-spacing:.5px;
  transition:.15s; border-radius:2px;
}
.btn:hover { background:var(--accent); color:#0d1420; }
.btn.g { border-color:var(--accent2); color:var(--accent2); }
.btn.g:hover { background:var(--accent2); color:#0d1420; }
.admin-link {
  width:31px; height:31px;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--border2); color:var(--dim2);
  background:transparent; text-decoration:none;
  border-radius:2px; transition:.15s; position:relative;
}
.admin-link::before {
  content:''; width:12px; height:12px;
  border:1.5px solid currentColor; border-radius:1px; transform:translate(-1px,1px);
}
.admin-link::after {
  content:''; position:absolute; width:11px; height:11px;
  border-top:1.5px solid currentColor; border-right:1.5px solid currentColor;
  background:linear-gradient(135deg, transparent 43%, currentColor 45%, currentColor 55%, transparent 57%);
  transform:translate(4px,-4px);
}
.admin-link:hover { border-color:var(--accent); color:var(--accent); background:rgba(77,184,255,.07); }

/* ─── MARKET TABS ─── */
.mkt-tabs {
  display:flex; padding:8px 22px 0;
  border-bottom:1px solid var(--border);
  overflow-x:auto; scrollbar-width:none; background:var(--panel);
}
.mkt-tabs::-webkit-scrollbar { display:none; }
.tab {
  padding:8px 24px; background:transparent;
  border:1px solid transparent; border-bottom:none;
  color:var(--dim2); font-family:'IBM Plex Sans',sans-serif;
  font-weight:600; font-size:13px; cursor:pointer; letter-spacing:.3px;
  transition:.12s; white-space:nowrap; flex-shrink:0;
}
.tab:hover { color:var(--text); }
.tab.active {
  color:var(--accent); border-color:var(--border);
  background:var(--bg); margin-bottom:-1px;
  border-bottom:1px solid var(--bg);
}

/* ─── VIEW TOGGLE ─── */
.vtoggle {
  display:none; gap:8px; align-items:center;
  padding:9px 22px; border-bottom:1px solid var(--border);
  background:var(--panel2);
}
.vtab {
  padding:5px 18px; border:1px solid var(--border2);
  background:transparent; color:var(--dim2);
  font-family:'IBM Plex Sans',sans-serif; font-weight:600;
  font-size:12px; cursor:pointer; letter-spacing:.3px;
  transition:.12s; border-radius:2px;
}
.vtab.active { border-color:var(--accent); color:var(--accent); background:rgba(77,184,255,.07); }
.vtab:hover:not(.active) { color:var(--text); border-color:var(--dim); }
.vtab.pvf { }
.vtab.pvf.active { border-color:var(--warn); color:var(--warn); background:rgba(255,212,77,.07); }
.vtog-label { color:var(--dim); font-size:11px; font-family:'IBM Plex Mono',monospace; }

/* ─── MAIN ─── */
.main { padding:14px 18px; }

/* ─── EMPTY ─── */
.empty {
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height:320px; gap:14px; color:var(--dim);
  font-family:'IBM Plex Mono',monospace; font-size:13px;
}
.empty-icon { font-size:42px; opacity:.25; }

/* ═══════════════════════════════════════════════════ HEATMAP */
:root {
  --hm-name-col: 170px;
  --hm-oi-col:   105px;
  --hm-gap:       14px;
  --hm-cell:      86px;
  --hm-grid-cols: var(--hm-name-col) var(--hm-oi-col) var(--hm-gap) repeat(6, var(--hm-cell)) var(--hm-gap) var(--hm-name-col) repeat(6, var(--hm-cell));
}

.main { overflow-x:auto; }

.hm-col-header {
  display:grid;
  grid-template-columns: var(--hm-grid-cols);
  grid-template-rows: auto auto;
  width:max-content;
  margin-left:auto; margin-right:auto;
  border:1px solid var(--border); background:var(--panel3);
  margin-bottom:3px;
}
.hm-ch-lbl {
  padding:7px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  color:var(--dim2); letter-spacing:.5px;
  display:flex; flex-direction:column; justify-content:flex-end;
  border-right:1px solid var(--border);
}
.hm-ch-oi {
  padding:7px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  color:var(--dim2); letter-spacing:.5px;
  display:flex; flex-direction:column; justify-content:flex-end;
  border-right:1px solid var(--border);
}
.hm-ch-gap { background:var(--bg); grid-row:1 / span 2; }
.hm-ch-side-title {
  padding:4px 8px; font-size:10px; color:var(--accent);
  letter-spacing:1px; text-transform:uppercase;
  border-bottom:1px solid var(--border);
  font-family:'IBM Plex Mono', monospace; font-weight:500;
  text-align:center; border-right:1px solid var(--border);
}
.hm-ch-col {
  padding:4px 6px; text-align:right;
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  color:var(--dim2); border-right:1px solid rgba(46,63,88,.5);
  grid-row:2;
}
.hm-ch-col:last-child { border-right:none; }

.pack-block {
  border:1px solid var(--border); background:var(--panel);
  margin:0 auto 4px; overflow:hidden; width:max-content;
}
.pack-hdr {
  display:grid;
  grid-template-columns: var(--hm-grid-cols);
  border-bottom:1px solid var(--border);
  min-height:34px;
}
.pack-label {
  display:flex; align-items:center; gap:6px; padding:6px 10px;
  border-right:1px solid var(--border);
}
.pack-oi-cell {
  display:flex; align-items:center; justify-content:flex-end; padding:6px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600;
  color:var(--text); border-right:1px solid var(--border);
}
.pack-name {
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  font-weight:700; letter-spacing:2.4px;
}
.pack-gap { background:var(--bg); border-left:1px solid var(--border); border-right:1px solid var(--border); }

.contract-row {
  display:grid;
  grid-template-columns: var(--hm-grid-cols);
  border-top:1px solid rgba(46,63,88,.6);
  min-height:32px;
}
.contract-row:hover { background:rgba(77,184,255,.04); }
.contract-row.oi-shock { background:rgba(255,212,77,.045); }
.contract-row.oi-shock:hover { background:rgba(255,212,77,.075); }
.c-label {
  display:flex; align-items:center; padding:4px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  font-weight:500; color:var(--text2);
  letter-spacing:.7px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  border-right:1px solid var(--border);
}
.shock-spark {
  flex:0 0 auto; color:#ffd44d; font-size:12px; line-height:1;
  margin:0 5px 0 1px; text-shadow:0 0 8px rgba(255,212,77,.65);
}
.contract-name { min-width:0; overflow:hidden; text-overflow:ellipsis; }
.c-oi-cell {
  display:flex; align-items:center; justify-content:flex-end; padding:4px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:500;
  color:var(--text); border-right:1px solid var(--border);
}
.c-gap { background:var(--bg); border-left:1px solid var(--border); border-right:1px solid var(--border); }

.cell {
  display:flex; align-items:center; justify-content:flex-end;
  padding:4px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:500;
  color:#ffffff;
  border-right:1px solid rgba(46,63,88,.4); white-space:nowrap;
}
.cell:last-child { border-right:none; }

.grand-block {
  border:1px solid rgba(77,184,255,.35);
  background:rgba(77,184,255,.05); margin:6px auto 0; overflow:hidden; width:max-content;
}
.grand-hdr {
  display:grid;
  grid-template-columns: var(--hm-grid-cols);
  min-height:38px;
}
.grand-label {
  display:flex; align-items:center; padding:6px 10px;
  border-right:1px solid rgba(77,184,255,.2);
}
.grand-oi-cell {
  display:flex; align-items:center; justify-content:flex-end; padding:6px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:700;
  color:var(--accent); border-right:1px solid rgba(77,184,255,.2);
}
.grand-name {
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  color:var(--accent); letter-spacing:1.7px;
}
.grand-gap { background:var(--bg); border-left:1px solid rgba(77,184,255,.2); border-right:1px solid rgba(77,184,255,.2); }
.grand-cell {
  display:flex; align-items:center; justify-content:flex-end;
  padding:6px 8px;
  font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:700;
  color:#ffffff; border-right:1px solid rgba(77,184,255,.12);
}
.grand-cell:last-child { border-right:none; }

/* ─── SERIES VIEW ─── */
.series-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.s-card {
  background:var(--panel); border:1px solid var(--border);
  padding:14px 14px 10px; border-radius:2px;
}
.s-card-title {
  font-family:'IBM Plex Mono', monospace;
  font-size:13px; color:var(--text); font-weight:600;
  letter-spacing:.5px; margin-bottom:10px;
}
.s-label {
  margin-bottom:6px; margin-top:20px;
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  color:var(--dim2); letter-spacing:1.5px; text-transform:uppercase;
}

/* ═══════════════════════════════════════════════════ PRE vs FINAL */

/* Grid: name | final OI | diff — per market column */
:root {
  --pvf-name:  180px;
  --pvf-oi:    110px;
  --pvf-diff:  110px;
  --pvf-cols:  var(--pvf-name) var(--pvf-oi) var(--pvf-diff);
}

.pvf-page {
  display:flex;
  gap:10px;
  width:max-content;
  margin:0 auto;
}

/* one market column */
.pvf-mkt-col {
  display:flex;
  flex-direction:column;
  border:1px solid var(--border);
  min-width:calc(var(--pvf-name) + var(--pvf-oi) + var(--pvf-diff));
}
.pvf-mkt-col:last-child { border-right:1px solid var(--border); }

/* market heading bar */
.pvf-mkt-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:7px 10px;
  background:var(--panel3);
  border-bottom:1px solid var(--border);
  min-height:30px;
}
.pvf-mkt-name {
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  font-weight:700; letter-spacing:2px; color:var(--accent);
}
.pvf-mkt-badge {
  font-family:'IBM Plex Mono', monospace; font-size:9px;
  color:var(--dim); letter-spacing:.5px;
}

/* column sub-headers */
.pvf-col-hdr {
  display:grid;
  grid-template-columns: var(--pvf-cols);
  border-bottom:1px solid var(--border);
  background:var(--panel2);
}
.pvf-ch {
  padding:5px 8px;
  font-family:'IBM Plex Mono', monospace; font-size:9px;
  color:var(--dim2); letter-spacing:.8px; text-transform:uppercase;
  border-right:1px solid rgba(46,63,88,.5);
}
.pvf-ch:last-child { border-right:none; text-align:right; }
.pvf-ch:nth-child(2) { text-align:right; }

/* pack group */
.pvf-pack-hdr {
  display:grid;
  grid-template-columns: var(--pvf-cols);
  border-bottom:1px solid rgba(46,63,88,.5);
  min-height:28px;
}
.pvf-pack-name-cell {
  display:flex; align-items:center; padding:4px 10px;
  border-right:1px solid var(--border);
}
.pvf-pack-lbl {
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  font-weight:700; letter-spacing:2px;
}
.pvf-pack-sum {
  display:flex; align-items:center; justify-content:flex-end;
  padding:4px 8px;
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  font-weight:600; color:var(--text);
  border-right:1px solid var(--border);
}
.pvf-pack-diff {
  display:flex; align-items:center; justify-content:flex-end;
  padding:4px 8px;
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  font-weight:600;
}

/* contract row */
.pvf-row {
  display:grid;
  grid-template-columns: var(--pvf-cols);
  border-top:1px solid rgba(46,63,88,.4);
  min-height:29px;
}
.pvf-row:hover { background:rgba(77,184,255,.04); }

.pvf-c-name {
  display:flex; align-items:center; padding:3px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  font-weight:500; color:var(--text2); letter-spacing:.6px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  border-right:1px solid rgba(46,63,88,.5);
}
.pvf-c-oi {
  display:flex; align-items:center; justify-content:flex-end;
  padding:3px 8px;
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  color:var(--text); border-right:1px solid rgba(46,63,88,.5);
}
.pvf-c-diff {
  display:flex; align-items:center; justify-content:flex-end;
  padding:3px 8px;
  font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600;
}

/* grand total row per market */
.pvf-grand {
  display:grid;
  grid-template-columns: var(--pvf-cols);
  border-top:1px solid rgba(77,184,255,.3);
  background:rgba(77,184,255,.05);
  min-height:32px;
}
.pvf-grand-lbl {
  display:flex; align-items:center; padding:4px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  color:var(--accent); letter-spacing:1px;
  border-right:1px solid rgba(77,184,255,.15);
}
.pvf-grand-oi {
  display:flex; align-items:center; justify-content:flex-end;
  padding:4px 8px;
  font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:700;
  color:var(--accent); border-right:1px solid rgba(77,184,255,.15);
}
.pvf-grand-diff {
  display:flex; align-items:center; justify-content:flex-end;
  padding:4px 8px;
  font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:700;
}

/* meta info bar above the pvf table */
.pvf-meta-bar {
  display:flex; gap:24px; align-items:center;
  padding:8px 0 10px;
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  color:var(--dim); flex-wrap:wrap;
}
.pvf-meta-bar b { color:var(--text2); }
.pvf-meta-tag {
  padding:2px 8px; border-radius:2px; font-size:9px; letter-spacing:.7px;
  border:1px solid; font-weight:600;
}
.pvf-meta-tag.pre   { border-color:rgba(80,232,144,.4); color:var(--accent2); }
.pvf-meta-tag.final { border-color:rgba(255,212,77,.4); color:var(--warn); }

/* ─── LOADING ─── */
#lo {
  display:none; position:fixed; inset:0;
  background:rgba(16,22,31,.88); z-index:999;
  flex-direction:column; align-items:center; justify-content:center; gap:14px;
}
#lo.show { display:flex; }
.spin {
  width:38px; height:38px; border:2px solid var(--border);
  border-top-color:var(--accent); border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.lo-msg {
  font-family:'IBM Plex Mono', monospace; font-size:12px;
  color:var(--accent); letter-spacing:2px;
}

/* ─── TOOLTIP ─── */
#tip {
  position:fixed; background:#1a2438; border:1px solid var(--accent);
  color:var(--text); padding:7px 12px;
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  pointer-events:none; z-index:200; display:none; line-height:1.9;
  border-radius:2px; box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.spark-tip-title  { color:var(--accent); font-weight:600; letter-spacing:.8px; margin-bottom:4px; }
.spark-tip-canvas { display:block; width:240px; height:92px; }

@media(max-width:1100px){ .series-grid{ grid-template-columns:repeat(3,1fr); } }
@media(max-width:800px) { .series-grid{ grid-template-columns:repeat(2,1fr); } }
@media(max-width:500px) { .series-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app">
<div id="lo"><div class="spin"></div><div class="lo-msg">LOADING OI DATA…</div></div>
<div id="tip"></div>

<header>
  <div class="logo">OI PROFILE</div>
  <div class="hdr-meta">
    <div class="hdr-stat"><span>LATEST</span><b id="hdrDate">—</b></div>
    <div class="hdr-stat"><span>MARKETS</span><b id="hdrMkts">—</b></div>
    <div class="hdr-stat"><span>CONTRACTS</span><b id="hdrCtrs">—</b></div>
  </div>
  <div class="hdr-right">
    <div class="dot" id="dot"></div>
    <div class="published-at" title="Last published timestamp">
      <span>PUBLISHED</span>
      <b id="hdrPublished">—</b>
    </div>
    <button class="btn g" onclick="fetchData()">⟳ REFRESH</button>
    <a class="admin-link" href="/admin/login" target="_blank" rel="noopener noreferrer" title="Admin login"></a>
  </div>
</header>

<div class="mkt-tabs" id="mktTabs"></div>

<div class="vtoggle" id="vtog">
  <span class="vtog-label">VIEW:</span>
  <button class="vtab active" id="vtabHeatmap"  onclick="switchView('heatmap',this)">⬛ HEATMAP</button>
  <button class="vtab"        id="vtabSeries"   onclick="switchView('series',this)">📈 SERIES</button>
  <button class="vtab pvf"    id="vtabPvf"      onclick="switchView('pvf',this)">◈ PRE vs FINAL</button>
</div>

<div class="main" id="mc">
  <div class="empty">
    <div class="empty-icon">[OI]</div>
    <div>FETCHING DASHBOARD DATA…</div>
  </div>
</div>
</div>

<script>
// ── STATE ──
const S = {
  markets:{}, marketOrder:[], active:null,
  view:'heatmap', charts:{},
  pvf:     null,   // pre-vs-final payload
  pvfLive: false,  // true only when current dataset is_final AND snapshot exists
};

const PACK_COLORS = [
  { name:'WHITES',  sideColor:'#b8c8dc', sideText:'#101820' },
  { name:'REDS',    sideColor:'#c83050', sideText:'#ffe0e8' },
  { name:'GREENS',  sideColor:'#1e7848', sideText:'#b0f0c8' },
  { name:'BLUES',   sideColor:'#1e50a0', sideText:'#b0d0ff' },
  { name:'GOLDS',   sideColor:'#a07800', sideText:'#ffe080' },
  { name:'PURPLES', sideColor:'#6030a0', sideText:'#e0b8ff' },
  { name:'ORANGES', sideColor:'#c05010', sideText:'#ffc080' },
  { name:'PINKS',   sideColor:'#c04090', sideText:'#ffd0ec' },
  { name:'SILVERS', sideColor:'#9aa6b2', sideText:'#101820' },
  { name:'COPPERS', sideColor:'#a85828', sideText:'#ffd4b8' },
];
const SOFR_PACKS = PACK_COLORS.map((pack, i) => ({
  ...pack,
  start:i * 4,
  end:i * 4 + 3,
}));
const TREAS_PACKS = [
  { name:'2 YR',  start:0, end:0,  sideColor:'#1e50a0', sideText:'#b0d0ff' },
  { name:'5 YR',  start:1, end:1,  sideColor:'#1e7848', sideText:'#b0f0c8' },
  { name:'10 YR', start:2, end:3,  sideColor:'#a07800', sideText:'#ffe080' },
  { name:'30 YR', start:4, end:5,  sideColor:'#882040', sideText:'#ffc0d8' },
];
const TREAS_KEYWORDS = ['treas','tnote','tbond','zn','zb','zt','zf','ultra'];

// Markets shown on the Pre vs Final page
const PVF_MARKET_KEYS = ['sr3','ff','treas','tnote','tbond','zn','zb','zt','zf','ultra'];

function isBrazilMarket(name) {
  const lc = String(name).toLowerCase();
  return lc.includes('brazil') || lc.includes('brl');
}
function isBrazilContract(contract) {
  return /^[FJNV]\d{2}$/i.test(String(contract).trim());
}
function marketContractCap(name) {
  const lc = String(name).trim().toLowerCase();
  if (lc.includes('sr3')) return 24;
  if (lc === 'er' || lc.includes('so3') || lc.includes('sonia')) return 20;
  return null;
}
function isFFMarket(name) {
  const lc = String(name).toLowerCase();
  return /(^|[^a-z0-9])ff($|[^a-z0-9])/.test(lc) || lc.includes('fed fund');
}
function ffPackName(contract) {
  const m = String(contract).trim().toUpperCase().match(/^([FGHJKMNQUVXZ])(\d{2})$/);
  if (!m) return null;
  const q = {
    F:'Q1', G:'Q1', H:'Q1',
    J:'Q2', K:'Q2', M:'Q2',
    N:'Q3', Q:'Q3', U:'Q3',
    V:'Q4', X:'Q4', Z:'Q4',
  }[m[1]];
  return q ? `${q} ${m[2]}` : null;
}
function ffPacks(contracts) {
  const byName = new Map();
  contracts.forEach(c => {
    const name = ffPackName(c);
    if (!name) return;
    if (!byName.has(name)) byName.set(name, []);
    byName.get(name).push(c);
  });
  return Array.from(byName, ([name, members], i) => ({
    name,
    contracts:members,
    sideColor:PACK_COLORS[i % PACK_COLORS.length].sideColor,
    sideText:PACK_COLORS[i % PACK_COLORS.length].sideText,
  }));
}
function normalizeMarketContracts(markets) {
  Object.entries(markets).forEach(([name, mkt]) => {
    if (!Array.isArray(mkt.contracts)) return;
    if (isBrazilMarket(name)) mkt.contracts = mkt.contracts.filter(isBrazilContract);
    const cap = marketContractCap(name);
    if (cap !== null) mkt.contracts = mkt.contracts.slice(0, cap);
  });
}
function packsForMarket(name, contracts = []) {
  const lc = name.toLowerCase();
  if (TREAS_KEYWORDS.some(k => lc.includes(k))) return TREAS_PACKS;
  if (isFFMarket(name)) return ffPacks(contracts);
  return SOFR_PACKS;
}
function isPvfMarket(name) {
  const lc = name.toLowerCase();
  return PVF_MARKET_KEYS.some(k => lc.includes(k));
}

const DIFFS = [
  { label:'1D',  i:1  },
  { label:'2D',  i:2  },
  { label:'3D',  i:3  },
  { label:'5D',  i:5  },
  { label:'11D', i:11 },
  { label:'21D', i:21 },
];
const LINE_COLORS = [
  '#4db8ff','#50e890','#ffd44d','#ff6b6b',
  '#b088ff','#ff9f50','#40ddb0','#ff80c0','#80b8ff'
];

const nearestCrosshair = {
  id:'nearestCrosshair',
  afterDraw(chart) {
    const active = chart.tooltip?.getActiveElements?.() ?? [];
    if (!active.length) return;
    const el = active[0].element;
    if (!el) return;
    const {ctx, chartArea} = chart;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(el.x, chartArea.top);
    ctx.lineTo(el.x, chartArea.bottom);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(220,232,248,.65)';
    ctx.setLineDash([3,3]);
    ctx.stroke();
    ctx.restore();
  }
};
Chart.register(nearestCrosshair);

// ── DATA FETCH ──
async function fetchData() {
  loading(true);
  try {
    const [dashRes, pvfRes] = await Promise.all([
      fetch('/api/dashboard-data'),
      fetch('/api/pre-vs-final'),
    ]);
    if (!dashRes.ok) throw new Error('No data available.');
    const payload = await dashRes.json();
    S.pvf = pvfRes.ok ? await pvfRes.json() : null;
    ingestPayload(payload);
  } catch(e) {
    document.getElementById('mc').innerHTML = `
      <div class="empty">
        <div class="empty-icon">[!]</div>
        <div>${e.message}</div>
      </div>`;
  } finally {
    loading(false);
  }
}

function ingestPayload(payload) {
  S.markets     = payload.markets || {};
  normalizeMarketContracts(S.markets);
  S.marketOrder = Array.isArray(payload.market_order)
    ? payload.market_order.filter(n => Object.prototype.hasOwnProperty.call(S.markets, n))
    : Object.keys(S.markets);
  const seen = new Set(S.marketOrder);
  Object.keys(S.markets).forEach(n => { if (!seen.has(n)) S.marketOrder.push(n); });
  const mkts = S.marketOrder;
  if (!mkts.length) {
    document.getElementById('mc').innerHTML = `<div class="empty"><div class="empty-icon">[OI]</div><div>NO DATA PUBLISHED YET</div></div>`;
    return;
  }
  S.active = mkts[0];
  const contractsCount = Object.values(S.markets).reduce((s,m) => s + (m.contracts?.length || 0), 0);
  document.getElementById('hdrDate').textContent      = payload.latest_date || '—';
  document.getElementById('hdrMkts').textContent      = payload.markets_count || mkts.length;
  document.getElementById('hdrCtrs').textContent      = contractsCount || payload.contracts_count || 0;
  const publishedEl = document.getElementById('hdrPublished');
  publishedEl.textContent = formatPublishedTime(payload.updated_at);
  publishedEl.parentElement.title = payload.updated_at
    ? `Last published: ${payload.updated_at}` : 'Last published timestamp';

  // PvF tab is live ONLY when the current dataset was published as Final OI.
  S.pvfLive = payload.is_final === true && S.pvf !== null;

  buildTabs();
  document.getElementById('vtog').style.display = 'flex';

  const pvfTab = document.getElementById('vtabPvf');
  if (S.pvfLive) {
    pvfTab.style.opacity = '1';
    pvfTab.style.cursor  = 'pointer';
    pvfTab.title = 'Pre vs Final comparison';
  } else {
    pvfTab.style.opacity = '0.38';
    pvfTab.style.cursor  = 'pointer';
    pvfTab.title = payload.is_final
      ? 'No Pre OI snapshot found — upload a Pre OI file first, then a Final OI file'
      : 'Active only after a Final OI file is published — current data is Pre OI';
  }

  render();
  document.getElementById('dot').classList.add('live');
}

// ── TABS ──
function buildTabs() {
  const el = document.getElementById('mktTabs');
  el.innerHTML = '';

  // For PvF view we use a fixed page, not per-market tabs — so we hide normal tabs when pvf is active
  if (S.view === 'pvf') {
    const b = document.createElement('span');
    b.style.cssText = 'padding:8px 14px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--warn);letter-spacing:1px;align-self:center;';
    b.textContent = '◈ PRE vs FINAL — SR3 · FF · TREASURIES';
    el.appendChild(b);
    return;
  }

  S.marketOrder.forEach(n => {
    const b = document.createElement('button');
    b.className = 'tab' + (n === S.active ? ' active' : '');
    b.textContent = n;
    b.onclick = () => {
      S.active = n;
      el.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      b.classList.add('active');
      render();
    };
    el.appendChild(b);
  });
}

function switchView(v, el) {
  S.view = v;
  document.querySelectorAll('.vtab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  buildTabs();
  render();
}

function contractLabelHTML(name, sideColor, shock) {
  const spark = shock
    ? '<span class="shock-spark" title="Latest 1D OI move exceeds 2 sigma and 5K absolute change">✦</span>'
    : '';
  return `<div class="c-label" style="border-left:3px solid ${sideColor}">${spark}<span class="contract-name">${escapeHTML(name)}</span></div>`;
}

function oiShock(cData, dates) {
  if (!cData || dates.length < 4) return false;
  const latest = Number(cData[dates[0]]);
  const prev   = Number(cData[dates[1]]);
  if (!Number.isFinite(latest) || !Number.isFinite(prev)) return false;
  const latestDelta = latest - prev;
  if (Math.abs(latestDelta) <= 5000) return false;
  const history = [];
  for (let i = 1; i < dates.length - 1; i++) {
    const a = Number(cData[dates[i]]);
    const b = Number(cData[dates[i+1]]);
    if (Number.isFinite(a) && Number.isFinite(b)) history.push(a - b);
  }
  if (history.length < 2) return false;
  const mean     = history.reduce((s,v) => s+v, 0) / history.length;
  const variance = history.reduce((s,v) => s + Math.pow(v - mean, 2), 0) / history.length;
  const sigma    = Math.sqrt(variance);
  return sigma > 0 && Math.abs(latestDelta - mean) >= 2 * sigma;
}

function cellHTML(lat, prev, mode, isHeader) {
  const cls = 'cell' + (isHeader ? ' pack-cell' : '');
  if (lat == null || prev == null) return `<div class="${cls}" style="color:#5a7a9a">—</div>`;
  const delta = lat - prev;
  const pct   = prev !== 0 ? (delta / prev) * 100 : 0;
  const val   = mode === 'pct' ? pct : delta;
  const pos   = val > 0, neg = val < 0;
  const ref   = mode === 'pct' ? Math.abs(pct) : (lat ? Math.abs(delta / lat) * 100 : 0);
  const inten = Math.min(ref, 20) / 20;
  const bg    = pos
    ? `rgba(30,150,70,${0.15 + inten * 0.45})`
    : neg
    ? `rgba(180,30,50,${0.15 + inten * 0.45})`
    : 'transparent';
  const txt = mode === 'pct'
    ? (pos ? '+' : '') + pct.toFixed(0)
    : (pos ? '+' : '') + fmt(delta);
  return `<div class="${cls}" style="background:${bg};color:#ffffff">${txt}</div>`;
}

function grandCell(lat, prev, mode) {
  if (lat == null || prev == null) return `<div class="grand-cell" style="color:#5a7a9a">—</div>`;
  const delta = lat - prev;
  const pct   = prev !== 0 ? (delta / prev) * 100 : 0;
  const val   = mode === 'pct' ? pct : delta;
  const pos   = val > 0, neg = val < 0;
  const ref   = mode === 'pct' ? Math.abs(pct) : (lat ? Math.abs(delta / lat) * 100 : 0);
  const inten = Math.min(ref, 20) / 20;
  const bg    = pos
    ? `rgba(30,150,70,${0.15 + inten * 0.5})`
    : neg
    ? `rgba(180,30,50,${0.15 + inten * 0.5})`
    : 'transparent';
  const txt   = mode === 'pct'
    ? (pos ? '+' : '') + pct.toFixed(0)
    : (pos ? '+' : '') + fmt(delta);
  return `<div class="grand-cell" style="background:${bg};color:#ffffff">${txt}</div>`;
}

// ════════════════════════════════════════════════════ PRE vs FINAL ══

function renderPvf(mc) {
  // Not live: current upload was Pre OI, or no snapshot exists yet
  if (!S.pvfLive) {
    const hasPvfData = S.pvf !== null;
    // Which message to show depends on why it's not live
    const icon = '◈';
    const headline = !hasPvfData
      ? 'NO PRE vs FINAL DATA YET'
      : 'CURRENT DATA IS PRE OI';
    const sub = !hasPvfData
      ? `First upload a <b style="color:var(--accent2)">Pre OI</b> file (standard publish),
         then upload a <b style="color:var(--warn)">Final OI</b> file from the admin panel.
         The comparison will appear here once a Final OI file is active.`
      : `This view is only active when the latest published file is <b style="color:var(--warn)">Final OI</b>.
         The current dataset was uploaded as <b style="color:var(--accent2)">Pre OI</b>.
         Upload the corresponding <b style="color:var(--warn)">Final OI</b> file from the admin panel to enable this view.`;
    mc.innerHTML = `
      <div class="empty">
        <div class="empty-icon" style="opacity:.2">${icon}</div>
        <div>${headline}</div>
        <div style="font-size:11px;color:var(--dim);margin-top:8px;max-width:460px;text-align:center;line-height:1.8">${sub}</div>
      </div>`;
    return;
  }

  const { pre, final, market_order } = S.pvf;

  // Filter to only PvF-relevant markets and those present in both snapshots
  const pvfMarkets = market_order.filter(m => isPvfMarket(m));

  if (!pvfMarkets.length) {
    mc.innerHTML = `<div class="empty"><div class="empty-icon">◈</div><div>NO SR3 / FF / TREASURY DATA IN SNAPSHOT</div></div>`;
    return;
  }

  // Meta bar
  const metaBar = document.createElement('div');
  metaBar.className = 'pvf-meta-bar';
  metaBar.innerHTML = `
    <span class="pvf-meta-tag pre">PRE</span>
    <span>Date: <b>${pre.snapshot_date || '—'}</b></span>
    <span style="color:var(--border2)">→</span>
    <span class="pvf-meta-tag final">FINAL</span>
    <span>Date: <b>${final.snapshot_date || '—'}</b></span>
    <span style="color:var(--border2)">|</span>
    <span style="color:var(--dim)">Diff = Final OI − Pre OI</span>`;
  mc.appendChild(metaBar);

  // Side-by-side market columns
  const page = document.createElement('div');
  page.className = 'pvf-page';

  pvfMarkets.forEach(mktName => {
    const preOI   = pre.markets?.[mktName]   || {};
    const finalOI = final.markets?.[mktName] || {};

    // Collect contracts in original sheet order.
    // Primary source: current dashboard data (preserves exact row order from the workbook).
    // Fallback: pre snapshot keys, then final snapshot keys — for any contract only in a snapshot.
    const liveContracts = S.markets[mktName]?.contracts ?? [];
    const seen = new Set(liveContracts);
    const extra = [
      ...Object.keys(preOI),
      ...Object.keys(finalOI),
    ].filter(c => !seen.has(c));
    const uncappedContracts = [...liveContracts, ...extra];
    const cap = marketContractCap(mktName);
    const allContracts = cap !== null ? uncappedContracts.slice(0, cap) : uncappedContracts;

    if (!allContracts.length) return;

    // Determine packs
    const packs = packsForMarket(mktName, allContracts);

    const col = document.createElement('div');
    col.className = 'pvf-mkt-col';

    // Market header
    const mktHead = document.createElement('div');
    mktHead.className = 'pvf-mkt-head';
    mktHead.innerHTML = `
      <span class="pvf-mkt-name">${escapeHTML(mktName)}</span>
      <span class="pvf-mkt-badge">${allContracts.length} contracts</span>`;
    col.appendChild(mktHead);

    // Column sub-headers
    const colHdr = document.createElement('div');
    colHdr.className = 'pvf-col-hdr';
    colHdr.innerHTML = `
      <div class="pvf-ch">CONTRACT</div>
      <div class="pvf-ch" style="text-align:right">FINAL OI</div>
      <div class="pvf-ch" style="text-align:right">DIFF</div>`;
    col.appendChild(colHdr);

    // Pack groups
    let grandFinal = 0, grandDiff = 0;

    packs.forEach(pack => {
      const pContracts = pack.contracts || allContracts.slice(pack.start, pack.end + 1);
      if (!pContracts.length) return;

      // Pack sums
      let packFinalSum = 0, packPreSum = 0;
      pContracts.forEach(c => {
        packFinalSum += Number(finalOI[c]) || 0;
        packPreSum   += Number(preOI[c])   || 0;
      });
      const packDiff = packFinalSum - packPreSum;
      grandFinal += packFinalSum;
      grandDiff  += packDiff;

      const sc = pack.sideColor, st = pack.sideText;
      const packHdr = document.createElement('div');
      packHdr.className = 'pvf-pack-hdr';
      packHdr.style.background = sc + '18';
      packHdr.innerHTML = `
        <div class="pvf-pack-name-cell" style="border-left:3px solid ${sc}">
          <span class="pvf-pack-lbl" style="color:${st === '#101820' ? sc : st}">${pack.name}</span>
        </div>
        <div class="pvf-pack-sum">${fmtOI(packFinalSum)}</div>
        <div class="pvf-pack-diff" style="${diffStyle(packDiff)}">${diffLabel(packDiff)}</div>`;
      col.appendChild(packHdr);

      pContracts.forEach(c => {
        const fVal = finalOI[c] != null ? Number(finalOI[c]) : null;
        const pVal = preOI[c]   != null ? Number(preOI[c])   : null;
        const diff = (fVal != null && pVal != null) ? fVal - pVal : null;

        const row = document.createElement('div');
        row.className = 'pvf-row';
        row.innerHTML = `
          <div class="pvf-c-name" style="border-left:3px solid ${sc}">${escapeHTML(c)}</div>
          <div class="pvf-c-oi">${fVal != null ? fmtOI(fVal) : '<span style="color:#5a7a9a">—</span>'}</div>
          <div class="pvf-c-diff" style="${diffStyle(diff)}">${diffLabel(diff)}</div>`;
        col.appendChild(row);
      });
    });

    // Grand total
    const grand = document.createElement('div');
    grand.className = 'pvf-grand';
    grand.innerHTML = `
      <div class="pvf-grand-lbl">TOTAL</div>
      <div class="pvf-grand-oi">${fmtOI(grandFinal)}</div>
      <div class="pvf-grand-diff" style="${diffStyle(grandDiff)}">${diffLabel(grandDiff)}</div>`;
    col.appendChild(grand);

    page.appendChild(col);
  });

  mc.appendChild(page);
}

/** CSS colour string for a diff value */
function diffStyle(val) {
  if (val == null || !Number.isFinite(val) || val === 0) return 'color:#7a95b8';
  const abs    = Math.abs(val);
  const inten  = Math.min(abs / 50000, 1);   // saturates at ±50K
  if (val > 0) return `color:#50e890;text-shadow:0 0 ${4 + inten * 8}px rgba(80,232,144,${0.3 + inten * 0.4})`;
  return             `color:#ff6b6b;text-shadow:0 0 ${4 + inten * 8}px rgba(255,107,107,${0.3 + inten * 0.4})`;
}

/** Formatted diff label with sign */
function diffLabel(val) {
  if (val == null || !Number.isFinite(val)) return '<span style="color:#5a7a9a">—</span>';
  if (val === 0) return '0';
  return (val > 0 ? '+' : '') + fmt(val);
}

// ── TOOLTIP ──
function showTip(e, contract, cData, dates) {
  const t = document.getElementById('tip');
  t.innerHTML = `
    <div class="spark-tip-title">${contract}</div>
    <canvas class="spark-tip-canvas" width="240" height="92"></canvas>`;
  t.style.display = 'block';
  drawSparkline(t.querySelector('canvas'), dates, cData);
  moveTip(e);
}
function moveTip(e) {
  const t = document.getElementById('tip');
  const x = Math.min(e.clientX + 16, window.innerWidth  - t.offsetWidth  - 12);
  const y = Math.min(e.clientY + 12, window.innerHeight - t.offsetHeight - 12);
  t.style.left = Math.max(12, x) + 'px';
  t.style.top  = Math.max(12, y) + 'px';
}
function hideTip() { document.getElementById('tip').style.display = 'none'; }

function drawSparkline(canvas, dates, cData) {
  const ctx = canvas.getContext('2d');
  const w   = canvas.width, h = canvas.height;
  const pad = { left:8, right:8, top:8, bottom:16 };
  const points = dates
    .map(d => ({ d, v: Number(cData[d]) }))
    .filter(p => Number.isFinite(p.v))
    .reverse();

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#10161f';
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(122,149,184,.18)';
  ctx.lineWidth   = 1;
  for (let i = 0; i < 3; i++) {
    const y = pad.top + i * ((h - pad.top - pad.bottom) / 2);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
  }

  if (points.length < 2) {
    ctx.fillStyle = '#7a95b8';
    ctx.font = '11px IBM Plex Mono, monospace';
    ctx.fillText('NO SERIES', 86, 50);
    return;
  }

  const vals = points.map(p => p.v);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 1; max += 1; }
  const xFor = i => pad.left + i * ((w - pad.left - pad.right) / (points.length - 1));
  const yFor = v => pad.top + (max - v) * ((h - pad.top - pad.bottom) / (max - min));

  const grad = ctx.createLinearGradient(0, pad.top, 0, h - pad.bottom);
  grad.addColorStop(0, 'rgba(77,184,255,.25)');
  grad.addColorStop(1, 'rgba(77,184,255,0)');

  ctx.beginPath();
  points.forEach((p, i) => {
    const x = xFor(i), y = yFor(p.v);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.lineTo(xFor(points.length - 1), h - pad.bottom);
  ctx.lineTo(xFor(0),                 h - pad.bottom);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  points.forEach((p, i) => {
    const x = xFor(i), y = yFor(p.v);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#4db8ff';
  ctx.lineWidth   = 2;
  ctx.stroke();

  const last = points[points.length - 1];
  const lx = xFor(points.length - 1), ly = yFor(last.v);
  ctx.fillStyle = '#50e890';
  ctx.beginPath();
  ctx.arc(lx, ly, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#7a95b8';
  ctx.font = '10px IBM Plex Mono, monospace';
  ctx.fillText(formatTooltipDate(points[0].d), pad.left, h - 4);
  const endLabel = formatTooltipDate(last.d);
  const endW = ctx.measureText(endLabel).width;
  ctx.fillText(endLabel, w - pad.right - endW, h - 4);
}

// ── FORMAT ──
function fmtOI(v) {
  if (v == null || isNaN(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (a >= 1e3) return (v / 1e3).toFixed(0) + 'K';
  return String(Math.round(v));
}
function fmt(v) {
  if (v == null || isNaN(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (a >= 1e3) return (v / 1e3).toFixed(0) + 'K';
  return String(Math.round(v));
}
function formatTooltipDate(v) {
  const s = String(v || '').trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (!m) return s;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const day    = m[1].padStart(2, '0');
  const month  = months[Math.max(0, Math.min(11, Number(m[2]) - 1))];
  const year   = m[3].slice(-2);
  return `${day}/${month}/${year}`;
}
function formatPublishedTime(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (Number.isNaN(d.getTime())) return String(v);
  return new Intl.DateTimeFormat(undefined, {
    day:'2-digit', month:'short', year:'2-digit',
    hour:'2-digit', minute:'2-digit',
  }).format(d);
}
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}
function escapeHTML(v) {
  return String(v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function loading(b) { document.getElementById('lo').classList.toggle('show', b); }

// ── INIT ──
fetchData();
</script>
