<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ share_meta.title if share_meta else 'OI Profile Dashboard' }}</title>
<meta name="description" content="{{ share_meta.description if share_meta else '' }}">
<!-- Open Graph / share cards -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ share_meta.title if share_meta else 'OI Profile Dashboard' }}">
<meta property="og:description" content="{{ share_meta.description if share_meta else '' }}">
<meta property="og:url" content="{{ share_meta.url if share_meta else '' }}">
<meta property="og:image" content="{{ share_meta.image if share_meta else '' }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ share_meta.title if share_meta else 'OI Profile Dashboard' }}">
<meta name="twitter:description" content="{{ share_meta.description if share_meta else '' }}">
<meta name="twitter:image" content="{{ share_meta.image if share_meta else '' }}">
<script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
<script>window.Chart||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"><\/script>')</script>
<style>
/* ============================================================
   OI PROFILE — Rates Open Interest Dashboard
   Institutional "Wall-Street" restyle, aligned to the
   Futures OI workbook: deep-navy chrome, slate section
   headers, dense tabular grids, per-column blue→white→green
   heat-map. Light, print-clean, high-contrast.
   ============================================================ */
:root{
  --bg:#eceff4;
  --panel:#ffffff;
  --ink:#17233b;          /* primary text / headings */
  --ink-soft:#43536e;     /* secondary text */
  --muted:#7b8aa1;        /* tertiary */
  --navy:#1b2c47;         /* title bar */
  --navy-2:#26436c;       /* title bar gradient end */
  --slate:#3f577c;        /* section header bars */
  --slate-2:#4f6b96;      /* mid slate */
  --slate-hd:#41597f;     /* column header row */
  --line:#d7dce5;         /* gridlines */
  --line-strong:#595959;  /* pack separators */
  --row-alt:#f4f6fa;      /* zebra */
  --chip:#e7ecf3;
  --pos:#1f9d6b;          /* up (green) */
  --neg:#cf3f38;          /* down (red) */
  --blue:#2f6fb0;         /* heat negative side */
  --green:#1f9d6b;        /* heat positive side */
  --accent:#3d7bd1;
  --shadow:0 1px 2px rgba(20,32,55,.06), 0 6px 22px rgba(20,32,55,.08);
  --mono:"SF Mono",ui-monospace,"Roboto Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:13px;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1,"cv01" 1;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- Title bar ---------- */
header.topbar{
  background:linear-gradient(100deg,var(--navy) 0%,var(--navy-2) 100%);
  color:#fff;
  padding:14px 24px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  border-bottom:3px solid #0f1b2e;
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand .l1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{
  font-size:20px;font-weight:800;letter-spacing:.14em;margin:0;
  text-transform:uppercase;color:#eaf1fb;
}
.brand .sub{
  font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:#8fb0d8;
}
.brand .meta{
  font-size:11.5px;color:#a9c1de;font-style:italic;letter-spacing:.02em;
  display:flex;gap:14px;flex-wrap:wrap;margin-top:2px;
}
.brand .meta b{color:#e7f0fb;font-style:normal;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.livedot{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:#bcd2ec}
.livedot i{width:9px;height:9px;border-radius:50%;background:#4fd18a;
  box-shadow:0 0 0 0 rgba(79,209,138,.6);animation:pulse 2.4s infinite}
.livedot{cursor:help}
.livedot.stale{color:#f5cf7a} .livedot.stale i{background:#f0b429;animation:none;box-shadow:0 0 0 3px rgba(240,180,41,.25)}
.livedot.off{color:#f3a3a3}   .livedot.off i{background:#e5484d;animation:none;box-shadow:0 0 0 3px rgba(229,72,77,.25)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,209,138,.55)}70%{box-shadow:0 0 0 9px rgba(79,209,138,0)}100%{box-shadow:0 0 0 0 rgba(79,209,138,0)}}
.btn{
  font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;border-radius:6px;border:1px solid transparent;
  padding:8px 14px;transition:.15s;white-space:nowrap;
}
.btn-refresh{background:#12508a;color:#eaf2fb;border-color:#2f6aa5}
.btn-refresh:hover{background:#1b64a9}
.btn-refresh:active{transform:translateY(1px)}

/* ---------- Control strip ---------- */
.controls{
  background:#dbe2ec;border-bottom:1px solid #c3ccda;
  padding:0 20px;display:flex;align-items:stretch;justify-content:space-between;
  gap:16px;flex-wrap:wrap;position:sticky;top:57px;z-index:30;
}
.tabs{display:flex;gap:0;overflow-x:auto}
.tab{
  appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);
  padding:13px 16px 11px;border-bottom:3px solid transparent;white-space:nowrap;transition:.12s;
}
.tab:hover{color:var(--navy);background:rgba(255,255,255,.45)}
.tab.active{color:var(--navy);border-bottom-color:var(--navy);background:rgba(255,255,255,.7)}
.viewtoggle{display:flex;align-items:center;gap:8px;padding:8px 0}
.seg{display:inline-flex;background:#c7d0dd;border-radius:8px;padding:3px}
.seg button{
  appearance:none;border:0;background:transparent;cursor:pointer;border-radius:6px;
  font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:#43536e;padding:7px 14px;transition:.12s;white-space:nowrap;
}
.seg button.active{background:var(--navy);color:#fff;box-shadow:0 1px 3px rgba(20,32,55,.25)}
.seg.small button{padding:5px 12px;font-size:11px}

/* ---------- Main ---------- */
main{padding:20px;max-width:1420px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.card-hd{
  background:linear-gradient(180deg,var(--slate) 0%,#374d70 100%);
  color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.card-hd .t{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.card-hd .t small{font-weight:600;letter-spacing:.1em;color:#c9d7ec;margin-left:8px}
.card-hd .r{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#c4d3e8;font-weight:600}

/* ---------- Heat-map / data table ---------- */
.tbl-wrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;font-size:12px}
table.grid th,table.grid td{border:1px solid var(--line);padding:5px 8px;white-space:nowrap}
table.grid thead th{
  background:#e9edf3;color:var(--ink-soft);font-weight:700;font-size:10.5px;
  letter-spacing:.07em;text-transform:uppercase;position:sticky;top:0;
  border-color:#cfd6e1;text-align:right;
}
table.grid thead th.grp{
  background:#41597f;color:#eaf1fb;text-align:center;letter-spacing:.12em;
  border-color:#31456a;
}
table.grid thead th.lbl{text-align:left}
table.grid td.lbl{
  text-align:left;font-weight:700;color:var(--ink);background:#fbfcfe;
  position:sticky;left:0;z-index:2;border-right:2px solid #cfd6e1;
}
table.grid td.num{text-align:right}
table.grid tbody tr:nth-child(even) td:not(.lbl){background:var(--row-alt)}
table.grid tbody tr:hover td{background:#eef3fb}
table.grid tbody tr:hover td.lbl{background:#eef3fb}
td.latest{font-weight:800;color:var(--ink);background:#f0f4fa !important;border-left:2px solid #cfd6e1;border-right:2px solid #cfd6e1}
tr.pack-sep td{border-bottom:2px solid var(--line-strong)}
tr.total td.up{color:var(--pos)} tr.total td.down{color:var(--neg)}
tr.total td{background:#e4e9f1 !important;font-weight:800;color:var(--navy);
  border-top:2px solid #9fb0c8}
td.pack-label{background:#eef1f6 !important;color:var(--slate);font-weight:800;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-align:left}
table.grid th.sepL,table.grid td.sepL{border-left:2px solid #aeb9ca}
table.grid th.sepX,table.grid td.sepX{border-left:4px solid #41597f}   /* # block | % block divider */
.delta-chip{display:inline-block;min-width:52px;text-align:right;font-family:var(--mono);
  font-size:11px;font-weight:700}
.up{color:var(--pos)} .down{color:var(--neg)} .flat{color:var(--muted)}
.spark{display:block}
.contract-sub{font-weight:600;color:var(--muted);font-size:10.5px;margin-left:6px}
table.grid thead th.sortable{cursor:pointer;user-select:none}
table.grid thead th.sortable:hover{color:var(--navy);background:#dfe6f0}
table.grid thead th.sorted{color:var(--navy);background:#dbe4f2}
th .arw{display:inline-block;width:1em;margin-left:3px;font-size:9px;color:var(--accent);text-align:center}
th.sortable:not(.sorted):hover .arw::after{content:'⇅';color:var(--muted)}
.pack-chip{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:3px;
  border:1px solid rgba(23,35,59,.12);font-size:9px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;vertical-align:1px}

/* ---------- legend ---------- */
.legend{display:flex;align-items:center;gap:16px;flex-wrap:nowrap;white-space:nowrap;overflow-x:auto;
  padding:10px 16px;border-top:1px solid var(--line);background:#fafbfd;
  font-size:11px;color:var(--ink-soft)}
.legend .ramp{display:inline-flex;height:12px;width:110px;border-radius:3px;overflow:hidden;
  border:1px solid #cfd6e1;background:linear-gradient(90deg,#2f6fb0,#eef2f7 50%,#1f9d6b)}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend b{color:var(--ink)}

/* ---------- Series ---------- */
.series-tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 16px;
  border-bottom:1px solid var(--line);background:#fafbfd}
.chart-box{padding:16px;height:490px}
.ser-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;padding:0 16px 14px}
.lg-item{appearance:none;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  font-family:var(--sans);font-size:11px;color:var(--ink-soft);padding:3px 5px;border-radius:4px}
.lg-item:hover{background:#eef3fb}
.lg-item i{width:8px;height:8px;border-radius:50%;flex:none}
.lg-item .lg-val{flex:none;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink);font-weight:700}
.lg-item.off{opacity:.45}
.lg-item.off .lg-name{text-decoration:line-through}
.series-tools label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:700}
.player{display:flex;align-items:center;gap:10px;margin-left:auto}
.btn-play{width:30px;height:30px;border-radius:50%;border:1px solid #c3ccda;background:#fff;color:var(--navy);
  cursor:pointer;font-size:11px;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:.12s}
.btn-play:hover,.btn-play.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.player input[type=range]{width:220px;accent-color:var(--navy);cursor:pointer}
.scrub-date{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);min-width:74px}
select.pick{font-family:var(--sans);font-size:12px;padding:6px 10px;border:1px solid #c3ccda;
  border-radius:6px;background:#fff;color:var(--ink)}

/* ---------- Pre vs Final ---------- */
.pvf-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn-ghost{background:#eef2f8;border:1px solid #c3ccda;color:var(--ink-soft)}
.btn-ghost:hover{background:#e2e9f3;color:var(--navy)}
.pvf-note{padding:10px 16px;font-size:11.5px;color:var(--ink-soft);background:#fafbfd;
  border-top:1px solid var(--line)}
.pvf-cols{display:flex;gap:16px;align-items:flex-start;padding:16px;overflow-x:auto}
.pvf-col{flex:1 1 0;min-width:380px}
.pvf-col table.grid{border:1px solid var(--line)}
table.grid thead th.pvf-mkt{text-align:left;padding:8px 10px}
.pvf-wait{padding:52px 24px 56px;text-align:center}
.pvf-wait .w1{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:12px}
.pvf-wait .w2{font-size:12.5px;line-height:1.8;color:var(--ink-soft);max-width:620px;margin:0 auto}
.pvf-wait .w3{color:var(--muted)}
.pvf-market-hd td{background:#eef1f6 !important;color:var(--slate);font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;font-size:10.5px}

/* ---------- misc ---------- */
.loading,.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}
.tip{position:fixed;pointer-events:none;z-index:100;background:var(--navy);color:#eaf1fb;
  font-size:11.5px;padding:8px 10px;border-radius:7px;box-shadow:0 8px 24px rgba(0,0,0,.28);
  opacity:0;transition:opacity .1s;max-width:260px;line-height:1.5}
.tip b{color:#fff}
.tip .k{color:#8fb0d8}
@media (max-width:640px){
  .brand h1{font-size:16px;letter-spacing:.1em}
  main{padding:12px}
  .card-hd .t{font-size:11px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="l1">
      <h1>OI&nbsp;Profile</h1>
      <span class="sub">Open&nbsp;Interest&nbsp;Dashboard</span>
    </div>
    <div class="meta">
      <span>As of <b id="m-date">—</b></span>
      <span><b id="m-mkts">—</b> markets</span>
      <span><b id="m-contracts">—</b> contracts</span>
      <span>Updated <b id="m-updated">—</b></span>
    </div>
  </div>
  <div class="topbar-right">
    <span class="livedot" id="live" title="Checking…"><i></i> <span id="live-txt">Live</span></span>
    <button class="btn btn-refresh" id="btn-refresh">↻ Refresh</button>
  </div>
</header>

<div class="controls">
  <div class="tabs" id="tabs"></div>
  <div class="viewtoggle">
    <div class="seg" id="seg">
      <button data-v="heatmap" class="active">▦ Heat-map</button>
      <button data-v="series">📈 Series</button>
      <button data-v="pvf">◈ Pre vs Final</button>
    </div>
  </div>
</div>

<main id="content">
  <div class="loading">Loading open-interest data…</div>
</main>

<div class="tip" id="tip"></div>

<script>
/* ============================ STATE ============================ */
const S = { markets:{}, order:[], active:null, view:'heatmap', pvf:null, charts:[],
            sort:{},       // per-market heat-map sort: {key:'latest'|'n<i>'|'p<i>', dir}; absent = curve order
            seriesVis:{},    // per-market visible series labels, once the user toggles the legend
            pvfSort:null };  // Pre vs Final sort shared by all market tables: {key:'pre'|'final'|'delta'|'pct', dir}
const COLS = 12;                 // recent trading days shown in heat-map
const MARKET_LABELS = {
  SR3:'SOFR 3-Month · SR3', FF:'Fed Funds 30-Day · ZQ / FF',
  treasuries:'US Treasury Futures', ER:'Euribor 3-Month · ER',
  SONIA:'SONIA 3-Month · SFI', Brazil:'Brazil DI1', CORRA:'CORRA 3-Month · CRA'
};
const STIR = new Set(['SR3','ER','SONIA','CORRA','FF']);   // pack-separated chains
// heat-map change horizons in trading-day offsets — mirrors the Futures OI summary (1D…3M)
const HZ=[['1D',1],['3D',3],['1W',5],['2W',10],['3W',15],['4W',20],['2M',42],['3M',63]];
const COLOR_PACK_MKTS = new Set(['SR3','ER','SONIA','CORRA']);   // quarterly chains: 4 contracts per colour pack
const PACKS = [['Whites','#eef1f6','#43536e'],['Reds','#cf3f38','#fff'],['Greens','#1f9d6b','#fff'],
  ['Blues','#2f6fb0','#fff'],['Golds','#c98a1f','#fff'],['Purples','#8e5bd0','#fff'],
  ['Oranges','#d06a1f','#fff'],['Pinks','#b0417a','#fff'],['Silvers','#9aa6b2','#fff'],['Coppers','#a85828','#fff']];
// FF packs = calendar quarters F G H | J K M | N Q U | V X Z; a part-quarter at either end stays its own group
const FF_MONTHS='FGHJKMNQUVXZ';
function ffQuarter(ct){
  const m=/^([FGHJKMNQUVXZ])(\d{2})$/i.exec(String(ct).trim()); if(!m) return null;
  const q=Math.floor(FF_MONTHS.indexOf(m[1].toUpperCase())/3);
  return {key:+m[2]*4+q, label:'Q'+(q+1)+' '+m[2]};
}
function packEndAt(m,contracts,ri){   // does row ri close a pack (separator under it)?
  if(ri>=contracts.length-1) return false;
  if(m==='FF'){ const a=ffQuarter(contracts[ri]), b=ffQuarter(contracts[ri+1]); return !!a && !!b && a.key!==b.key; }
  return STIR.has(m) && (ri+1)%4===0;
}
function packOf(m,contracts,ri){   // {g: pack index along the curve, label}
  if(COLOR_PACK_MKTS.has(m)){ const g=Math.floor(ri/4); return PACKS[g]?{g,label:PACKS[g][0]}:null; }
  if(m==='FF'){ const q=ffQuarter(contracts[ri]); if(!q) return null;
    let g=0; for(let i=0;i<ri;i++) if(packEndAt(m,contracts,i)) g++;
    return {g,label:q.label}; }
  return null;
}
// always rendered so the Contract column keeps the same width; only visible when sorted
function packChip(m,contracts,ri,hidden){
  const pk=packOf(m,contracts,ri); if(!pk) return '';
  const p=PACKS[pk.g%PACKS.length];
  return '<span class="pack-chip" style="background:'+p[1]+';color:'+p[2]+(hidden?';visibility:hidden':'')+'">'+esc(pk.label)+'</span>';
}

/* ============================ HELPERS ============================ */
const $ = s => document.querySelector(s);
function fmtOI(v){
  if(v===null||v===undefined||v==='') return '·';
  const n=Number(v); if(!isFinite(n)) return '·';
  const a=Math.abs(n);
  // everything in K so the table reads in one unit: 2.3K · 13K · 1,259K
  if(a>=5e3) return Math.round(n/1e3).toLocaleString('en-US')+'K';
  if(a>=1e3) return (n/1e3).toFixed(1)+'K';
  return String(Math.round(n));
}
function fmtSigned(v){
  if(v===null||v===undefined||!isFinite(v)) return '·';
  const s=v>0?'+':(v<0?'−':'');
  return s+fmtOI(Math.abs(v));
}
function fmtPct0(v){ const r=Math.round(v); return (r>0?'+':'')+r+'%'; }   // whole %, never "-0%"
function fmtPctNum(v){ const r=Math.round(v); return (r>0?'+':'')+r; }       // whole %, no "%" symbol — the column header says %
// heat-map % cells: one decimal inside ±5, whole numbers beyond (+12, −37); never "-0.0"
function fmtHmPct(v){
  const s=Math.abs(v)>=4.95?v.toFixed(0):v.toFixed(1);
  return Number(s)===0?'0.0':(v>0?'+':'')+s;
}
function pct(a,b){ if(a===null||b===null||b===0||a===undefined||b===undefined) return null; return (a-b)/Math.abs(b)*100; }
function parseD(s){ // dd/mm/yy -> Date
  const m=/^(\d{2})\/(\d{2})\/(\d{2})$/.exec(String(s)); if(!m) return null;
  return new Date(2000+ +m[3], +m[2]-1, +m[1]);
}
function heatColor(t){ // t in [-1,1] : blue(neg) -> white -> green(pos)
  if(t===null||!isFinite(t)) return 'transparent';
  if(Math.abs(t)<0.04) return 'transparent';
  if(t>0){ const a=Math.min(1,t); return `rgba(31,157,107,${(0.10+0.6*a).toFixed(3)})`; }
  const a=Math.min(1,-t); return `rgba(47,111,176,${(0.10+0.6*a).toFixed(3)})`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================ DATA ============================ */
// header status dot: live (green) · stale (amber: a publication was missed) · off (red: last check failed)
function setLive(state,title){
  const el=$('#live'); el.className='livedot'+(state==='live'?'':' '+state); el.title=title;
  $('#live-txt').textContent={live:'Live',stale:'Stale',off:'Offline'}[state];
}
function prevBizDay(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); do x.setDate(x.getDate()-1); while(x.getDay()===0||x.getDay()===6); return x; }
// OI for day T lands on T+1, so before that morning's upload the data is normally 2 business days old —
// only call it stale once it is older than that (one publication actually missed)
function isStale(latest,now){ const d=parseD(latest); return !!d && d<prevBizDay(prevBizDay(now)); }
const hhmm=()=>new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});

async function fetchData(){
  let r, d;
  try{   // only the network part can make the dot red — a rendering bug must not read as "Offline"
    r = await fetch('/api/dashboard-data',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    d = await r.json();
  }catch(e){
    if(r && r.status===404){   // server is fine, nothing has been published yet
      setLive('stale','No data published yet · checked '+hhmm());
      $('#content').innerHTML = '<div class="card"><div class="empty">No data published yet. Once a workbook is uploaded on the admin panel it appears here automatically.</div></div>';
      return;
    }
    // server unreachable / error: keep showing the last good data rather than blanking the board
    setLive('off','Could not reach the server at '+hhmm()+(S.meta?' — showing data as of '+(S.meta.latest||'—'):'')+'. Retries automatically every 5 min.');
    if(!S.order.length) $('#content').innerHTML = '<div class="card"><div class="empty">Could not reach the server. It will retry automatically.</div></div>';
    return;
  }
  const stale=isStale(d.latest_date,new Date());
  setLive(stale?'stale':'live',(stale?'Behind schedule — a daily publication looks missed. ':'')+
    'Data as of '+(d.latest_date||'—')+' · published '+fmtUpdated(d.updated_at)+' · checked '+hhmm());
  S.markets = d.markets||{}; S.order = d.market_order||[];
  if(S.active && !S.markets[S.active])   // market from URL: accept any letter case
    S.active = S.order.find(m=>m.toLowerCase()===String(S.active).toLowerCase())||null;
  if(!S.active) S.active = S.order[0]||null;
  if(S.urlSort){ S.sort[S.active]=S.urlSort; S.urlSort=null; }
  S.meta = { latest:d.latest_date, isFinal:d.is_final===true, updated:d.updated_at };
  S.pvf = null;   // re-check Pre vs Final on every refresh, so "waiting" flips to the comparison by itself
  $('#m-date').textContent = d.latest_date||'—';
  $('#m-mkts').textContent = d.markets_count ?? S.order.length;
  $('#m-contracts').textContent = d.contracts_count ?? '—';
  $('#m-updated').textContent = fmtUpdated(d.updated_at);
  buildTabs(); render();
}
function fmtUpdated(iso){
  if(!iso) return '—';
  try{ const d=new Date(iso); return d.toLocaleString(undefined,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
async function ensurePvf(){
  if(S.pvf!==null) return S.pvf;
  try{ const r=await fetch('/api/pre-vs-final',{cache:'no-store'}); S.pvf = r.ok ? await r.json() : {error:true}; }
  catch(e){ S.pvf={error:true}; }
  return S.pvf;
}

/* ============================ CHROME ============================ */
function buildTabs(){
  const box=$('#tabs'); box.innerHTML='';
  S.order.forEach(m=>{
    const b=document.createElement('button');
    b.className='tab'+(m===S.active?' active':'');
    b.textContent=(m==='treasuries')?'Treasuries':m;
    b.onclick=()=>{ S.active=m; buildTabs(); render(); };
    box.appendChild(b);
  });
}
function setView(v){
  S.view=v;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  render();
}
function killCharts(){
  clearInterval(S.playTimer); S.playTimer=null;   // stop any Series replay
  S.charts.forEach(c=>{try{c.destroy()}catch(e){}}); S.charts=[];
}

/* ============================ URL STATE ============================ */
// shareable link to the current page + sort, e.g. ?m=SR3&sort=pct-1D-desc · ?m=FF&v=series · ?v=pvf&sort=delta-desc
const VIEWS=['heatmap','series','pvf'];
function sortToParam(s){
  if(s.key==='latest') return 'latest-'+s.dir;
  return (s.key[0]==='n'?'abs':'pct')+'-'+HZ[+s.key.slice(1)][0]+'-'+s.dir;
}
function paramToSort(p){
  const m=/^(?:(latest)|(abs|pct)-(\w+))-(asc|desc)$/i.exec(p||''); if(!m) return null;
  const dir=m[4].toLowerCase();
  if(m[1]) return {key:'latest',dir};
  const i=HZ.findIndex(([lab])=>lab.toLowerCase()===m[3].toLowerCase()); if(i<0) return null;
  return {key:(m[2].toLowerCase()==='abs'?'n':'p')+i, dir};
}
function syncUrl(){
  const q=new URLSearchParams();
  if(S.active) q.set('m',S.active);
  if(S.view!=='heatmap') q.set('v',S.view);
  const s=S.sort[S.active];
  if(s && S.view==='heatmap') q.set('sort',sortToParam(s));
  if(S.pvfSort && S.view==='pvf') q.set('sort',S.pvfSort.key+'-'+S.pvfSort.dir);
  const url=location.pathname+(q.toString()?'?'+q:'');
  if(url!==location.pathname+location.search) history.replaceState(null,'',url);
}

/* ============================ RENDER ROUTER ============================ */
function render(){
  killCharts();
  const c=$('#content');
  if(!S.active){ c.innerHTML='<div class="card"><div class="empty">No markets available.</div></div>'; return; }
  syncUrl();
  if(S.view==='heatmap') renderHeatmap(c);
  else if(S.view==='series') renderSeries(c);
  else renderPvf(c);
}

/* ============================ HEAT-MAP ============================ */
function renderHeatmap(c){
  const mk=S.markets[S.active]; if(!mk){c.innerHTML='';return;}
  // newest-first; junk header columns (#REF!, repeated blocks) dropped. Rows stay generic curve positions,
  // so each horizon compares today's Nth contract with whichever contract was Nth on that date
  const dates=cleanDates(mk.dates||[]);
  const contracts=mk.contracts||[];
  const latestD=dates[0];
  const chNum={}, chPct={};
  const maxN=HZ.map(()=>0), maxP=HZ.map(()=>0);
  contracts.forEach(ct=>{
    const cur=mk.data[ct]?.[latestD];
    chNum[ct]=HZ.map(([,off],i)=>{
      const past=mk.data[ct]?.[dates[off]];
      if(cur==null||past==null) return null;
      const d=cur-past; if(Math.abs(d)>maxN[i]) maxN[i]=Math.abs(d); return d;
    });
    chPct[ct]=HZ.map(([,off],i)=>{
      const p=pct(cur, mk.data[ct]?.[dates[off]]);
      if(p!==null && Math.abs(p)>maxP[i]) maxP[i]=Math.abs(p); return p;
    });
  });
  // header — two segregated blocks: Δ (#) and Δ (%)
  let h='<div class="card"><div class="card-hd"><div class="t">'+esc(MARKET_LABELS[S.active]||S.active)+
        '<small>Open-Interest change · vs prior sessions · generic (by curve position)</small></div>'+
        '<div class="r">Δ OI · green rising · blue falling</div></div><div class="tbl-wrap"><table class="grid"><thead>';
  const sort=S.sort[S.active]||null;
  const sortTh=(key,label,cls,attrs)=>{
    const on=!!sort&&sort.key===key;
    return '<th class="sortable'+(cls?' '+cls:'')+(on?' sorted':'')+'" data-sort="'+key+'"'+(attrs||'')+
      ' aria-sort="'+(on?(sort.dir==='asc'?'ascending':'descending'):'none')+'">'+label+
      '<span class="arw">'+(on?(sort.dir==='asc'?'▲':'▼'):'')+'</span></th>';
  };
  // Contract restores curve order; it only shows ⇅ on hover
  h+='<tr><th class="lbl sortable" rowspan="2" data-sort="" title="Curve order">Contract<span class="arw"></span></th>'+
     '<th class="lbl" rowspan="2">Trend</th>'+
     sortTh('latest','Latest OI','',' rowspan="2"')+
     '<th class="grp sepL" colspan="'+HZ.length+'">Δ Open Interest&nbsp;(#)</th>'+
     '<th class="grp sepX" colspan="'+HZ.length+'">Δ Open Interest&nbsp;(%)</th></tr><tr>';
  HZ.forEach(([lab],i)=>h+=sortTh('n'+i,lab,i===0?'sepL':''));
  HZ.forEach(([lab],i)=>h+=sortTh('p'+i,lab,i===0?'sepX':''));
  h+='</tr></thead><tbody>';
  // row order: curve order by default; when sorted, across the whole curve (blanks always last)
  const rows=contracts.map((ct,ri)=>({ct,ri}));
  if(sort){
    const val=r=>sort.key==='latest'?mk.data[r.ct]?.[latestD]
      :(sort.key[0]==='n'?chNum:chPct)[r.ct][+sort.key.slice(1)];
    const sgn=sort.dir==='asc'?1:-1;
    rows.sort((a,b)=>{const va=val(a),vb=val(b);
      if(va==null) return vb==null?a.ri-b.ri:1;
      if(vb==null) return -1;
      return (va-vb)*sgn||a.ri-b.ri;});
  }
  rows.forEach(({ct,ri})=>{
    const latest=mk.data[ct]?.[latestD];
    const sepClass=(!sort && packEndAt(S.active,contracts,ri))?'pack-sep':'';
    h+='<tr class="'+sepClass+'">';
    h+='<td class="lbl">'+esc(ct)+packChip(S.active,contracts,ri,!sort)+'</td>';
    h+='<td class="num">'+sparkline(ct,mk,dates)+'</td>';
    h+='<td class="latest num">'+fmtOI(latest)+'</td>';
    // Δ (#) block
    chNum[ct].forEach((d,i)=>{
      const t=(d===null||maxN[i]===0)?null:d/maxN[i];
      const cls=d<0?'down':'';
      const tip=esc(ct+' · Δ'+HZ[i][0]+' (#)\n'+(d===null?'—':fmtSigned(d)+' contracts vs '+(dates[HZ[i][1]]||'—')));
      h+='<td class="num '+cls+(i===0?' sepL':'')+'" style="background:'+heatColor(t)+'" data-tip="'+tip+'">'+(d===null?'·':fmtSigned(d))+'</td>';
    });
    // Δ (%) block
    chPct[ct].forEach((p,i)=>{
      const t=(p===null||maxP[i]===0)?null:p/maxP[i];
      const cls=p<0?'down':'';
      const tip=esc(ct+' · Δ'+HZ[i][0]+' (%)\n'+(p===null?'—':(p>0?'+':'')+p.toFixed(2)+'% vs '+(dates[HZ[i][1]]||'—')));
      h+='<td class="num '+cls+(i===0?' sepX':'')+'" style="background:'+heatColor(t)+'" data-tip="'+tip+'">'+(p===null?'·':fmtHmPct(p))+'</td>';
    });
    h+='</tr>';
  });
  // TOTAL row — summed OI change per horizon (heat-map excluded)
  let sumNow=0; contracts.forEach(ct=>{const a=mk.data[ct]?.[latestD]; if(a!=null) sumNow+=+a;});
  const tot=HZ.map(([,off])=>{let sn=0,sp=0,any=false;
    contracts.forEach(ct=>{const a=mk.data[ct]?.[latestD],b=mk.data[ct]?.[dates[off]];
      if(a!=null&&b!=null){sn+=+a;sp+=+b;any=true;}});
    return any?{d:sn-sp,p:sp!==0?(sn-sp)/Math.abs(sp)*100:null}:{d:null,p:null};});
  h+='<tr class="total"><td class="lbl">TOTAL</td><td></td><td class="num">'+fmtOI(sumNow)+'</td>';
  tot.forEach((x,i)=>h+='<td class="num '+(x.d<0?'down':'')+(i===0?' sepL':'')+'">'+(x.d===null?'·':fmtSigned(x.d))+'</td>');
  tot.forEach((x,i)=>h+='<td class="num '+(x.p<0?'down':'')+(i===0?' sepX':'')+'">'+(x.p===null?'·':fmtHmPct(x.p))+'</td>');
  h+='</tr>';
  h+='</tbody></table></div>';
  h+='<div class="legend"><span class="lg">OI falling <span class="ramp"></span> OI rising</span>'+
     '<span class="lg" style="color:var(--muted)">per-column scale · white ≈ unchanged · negatives <span class="down">red</span> · '+
     'click header to sort ▼/▲ · <b>Contract</b> resets</span></div>';
  h+='</div>';
  c.innerHTML=h;
  c.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{
    // cycle: descending → ascending → curve order (Contract always → curve order)
    const k=th.dataset.sort, cur=S.sort[S.active];
    if(!k || (cur && cur.key===k && cur.dir==='asc')) delete S.sort[S.active];
    else S.sort[S.active]={key:k, dir:(cur && cur.key===k)?'asc':'desc'};
    const sl=c.querySelector('.tbl-wrap')?.scrollLeft||0;
    render();
    const w=c.querySelector('.tbl-wrap'); if(w) w.scrollLeft=sl;
  });
  wireTips();
}

function sparkline(ct,mk,allDates){
  // chronological OI series (oldest -> newest), last ~30 points
  const ds=[...allDates].reverse().slice(-30);
  const pts=ds.map(d=>mk.data[ct]?.[d]).filter(v=>v!==null&&v!==undefined).map(Number);
  if(pts.length<2) return '';
  const w=88,hgt=22,pad=2;
  const mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1;
  const step=(w-2*pad)/(pts.length-1);
  const path=pts.map((v,i)=>(pad+i*step).toFixed(1)+','+(pad+(hgt-2*pad)*(1-(v-mn)/rg)).toFixed(1)).join(' ');
  const up=pts[pts.length-1]>=pts[0];
  const col=up?'#1f9d6b':'#cf3f38';
  return '<svg class="spark" width="'+w+'" height="'+hgt+'" viewBox="0 0 '+w+' '+hgt+'">'+
    '<polyline fill="none" stroke="'+col+'" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" points="'+path+'"/>'+
    '<circle cx="'+(pad+(pts.length-1)*step).toFixed(1)+'" cy="'+(pad+(hgt-2*pad)*(1-(pts[pts.length-1]-mn)/rg)).toFixed(1)+'" r="1.9" fill="'+col+'"/></svg>';
}

/* ============================ SERIES ============================ */
// slots 1-4 go to the default-visible lines (validated all-pairs incl. colour-blind);
// 5-8 to the next lines switched on; 9-12 only matter with 9+ lines shown
const SERIES_PALETTE=['#2a78d6','#eb6834','#199e70','#4a3aa7',
  '#c98500','#d55181','#008300','#e34948',
  '#1b2c47','#0f8a8a','#8a5a2b','#6b7a90'];
function fmtDateShort(s){const d=parseD(s);return d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):s;}
function fmtDateLong(s){const d=parseD(s);return d?d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}):s;}

// vertical crosshair on hover
const crosshairPlugin={id:'crosshair',afterDatasetsDraw(chart){
  const a=chart.tooltip&&chart.tooltip._active;
  if(a&&a.length){
    const x=a[0].element.x,{top,bottom}=chart.chartArea,cx=chart.ctx;
    cx.save();cx.beginPath();cx.moveTo(x,top);cx.lineTo(x,bottom);
    cx.lineWidth=1;cx.setLineDash([4,4]);cx.strokeStyle='rgba(27,44,71,.30)';cx.stroke();cx.restore();
  }
}};

// value labels at the right end of each visible line. Positions are pinned to where each line FINISHES,
// so during a replay the labels never move or swap — only the values update. Nudged apart if close.
const shortName=ct=>String(ct).replace(/^US\s+/i,'').replace(/\s*YEAR\s*/i,'Y ').replace(/\s*TREASURY/i,'').replace(/ULTRA/i,'Ultra').trim();
const END_FONT='700 11px Inter,"Segoe UI",system-ui,sans-serif';
const lastVal=arr=>{ for(let k=arr.length-1;k>=0;k--) if(arr[k]!=null) return arr[k]; return null; };
const endLabelPlugin={id:'endLabels',afterDatasetsDraw(chart,args,opts){
  const {ctx,chartArea}=chart, items=[];
  chart.data.datasets.forEach((ds,j)=>{
    if(!chart.isDatasetVisible(j)) return;
    const anchor=lastVal(ds.$full||ds.data); if(anchor==null) return;
    const now=lastVal(ds.data);
    items.push({y:chart.scales.y.getPixelForValue(anchor),color:ds.borderColor,
      text:shortName(ds.label)+'  '+(now==null?'·':opts.fmt(now))});
  });
  items.sort((a,b)=>a.y-b.y);
  for(let i=1;i<items.length;i++) items[i].y=Math.max(items[i].y,items[i-1].y+14);
  const over=items.length?items[items.length-1].y-(chartArea.bottom-6):0;
  if(over>0) items.forEach(it=>it.y-=over);
  const x0=chartArea.right+10;
  ctx.save(); ctx.font=END_FONT; ctx.textBaseline='middle';
  items.forEach(it=>{
    ctx.fillStyle=it.color; ctx.beginPath(); ctx.arc(x0+4,it.y,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#17233b'; ctx.fillText(it.text,x0+13,it.y);
  });
  ctx.restore();
}};
function endLabelWidth(datasets,fmt){   // right padding wide enough for the longest end label
  const cx=document.createElement('canvas').getContext('2d'); cx.font=END_FONT; let w=0;
  datasets.forEach(ds=>ds.data.forEach(v=>{ if(v!=null) w=Math.max(w,cx.measureText(shortName(ds.label)+'  '+fmt(v)).width); }));
  return Math.ceil(w)+28;
}

// default lines: alternate contracts, max 4; with under 8 contracts, top up from the front (6 → 0,1,2,4)
function defaultVisible(n){
  const v=[];
  for(let i=0;i<n&&v.length<4;i+=2) v.push(i);
  for(let i=1;i<n&&v.length<4;i+=2) v.push(i);
  return new Set(v);
}
/* Rows come from generic tickers (SFR1, SFR2 …): each row is a curve position, and on a roll date
   every row steps to the next contract. These rebuild each contract's own history for the chart. */
function cleanDates(ds){   // newest-first; drop junk headers (#REF!, repeated blocks): real dates, strictly descending
  const out=[]; let last=null;
  for(const s of ds){ const d=parseD(s); if(!d) continue; if(last===null||d<last){ out.push(s); last=d; } }
  return out;
}
function rollIdx(mk,chron){   // indices t where the strip rolled between chron[t-1] and chron[t]
  const cs=mk.contracts||[], out=new Set();
  for(let t=1;t<chron.length;t++){
    let votes=0,tot=0;
    for(let k=0;k<cs.length-1;k++){
      const a=mk.data[cs[k]]?.[chron[t]], same=mk.data[cs[k]]?.[chron[t-1]], next=mk.data[cs[k+1]]?.[chron[t-1]];
      if(a==null||same==null||next==null) continue;
      tot++; if(Math.abs(a-next)<Math.abs(a-same)) votes++;   // today's row k matches yesterday's row k+1
    }
    if(tot>=3 && votes/tot>=0.6) out.add(t);
  }
  return out;
}
function stitchedSeries(mk,chron,rolls,i){   // today's i-th contract sat one row further back per roll
  const cs=mk.contracts||[], out=new Array(chron.length); let r=0;
  for(let t=chron.length-1;t>=0;t--){
    const v=cs[i+r]!=null?mk.data[cs[i+r]]?.[chron[t]]:null;
    out[t]=v==null?null:Number(v);
    if(rolls.has(t)) r++;
  }
  return out;
}
// roll = {idx:Set, stitch:bool} — stitch where the full strip is present; otherwise just break the line at each roll
function seriesDatasets(mk,contracts,dates,N,mode,roll,defVis){
  const vis=S.seriesVis[S.active], def=defVis||defaultVisible(N);
  // colour slot per contract: default-visible lines first (curve order), then the rest — fixed, so toggling never repaints
  const slotOrder=[...[...def].sort((a,b)=>a-b), ...[...Array(N).keys()].filter(i=>!def.has(i))];
  const slot=new Map(slotOrder.map((ci,k)=>[ci,k]));
  return contracts.slice(0,N).map((ct,i)=>{
    const col=SERIES_PALETTE[slot.get(i)%SERIES_PALETTE.length];
    const raw=roll.stitch ? stitchedSeries(mk,dates,roll.idx,i)
      : dates.map(d=>{const v=mk.data[ct]?.[d];return v==null?null:Number(v);});
    let data=raw;
    if(mode==='pct'){ let base=null; for(const v of raw){ if(v!=null){base=v;break;} }
      data=raw.map(v=>(v==null||base==null||base===0)?null:(v-base)/base*100); }
    const hidden=vis ? !vis.includes(ct) : !def.has(i);   // the rest are one legend click away
    return { label:ct, data, hidden, borderColor:col, backgroundColor:col,
      borderWidth:2, tension:.35, cubicInterpolationMode:'monotone', spanGaps:true,
      segment:roll.stitch?undefined:{borderColor:c=>roll.idx.has(c.p1DataIndex)?'transparent':undefined},
      pointRadius:(ctx)=>{let li=-1;const a=ctx.dataset.data;for(let k=a.length-1;k>=0;k--){if(a[k]!=null){li=k;break;}}return ctx.dataIndex===li?3.2:0;},
      pointBackgroundColor:col, pointBorderColor:'#fff', pointBorderWidth:1.6,
      pointHoverRadius:5, pointHoverBorderColor:'#fff', pointHoverBorderWidth:2 };
  });
}
function renderSeries(c){
  const mk=S.markets[S.active]; if(!mk){c.innerHTML='';return;}
  if(!S.seriesMode) S.seriesMode='pct';
  const mode=S.seriesMode, isPct=(mode==='pct');
  const brazil=/brazil|brl/i.test(S.active);
  // Brazil Series: January (F) contracts only — first 4 shown, the rest listed but off by default
  const contracts=brazil?(mk.contracts||[]).filter(ct=>/^F\d{2}$/i.test(ct)):(mk.contracts||[]);
  let dates=cleanDates(mk.dates||[]).reverse();     // chronological (oldest→newest)
  // Brazil is filtered to F/J/N/V server-side, so its strip has gaps and can't be re-stitched
  let roll={idx:rollIdx(mk,dates), stitch:!brazil};
  // unstitchable: show only the stretch since the last roll, where each row is one contract throughout
  let sinceRoll=null;
  if(!roll.stitch && roll.idx.size){
    const k=Math.max(...roll.idx); sinceRoll=dates[k];
    dates=dates.slice(k); roll={idx:new Set(), stitch:false};
  }
  const labels=dates.slice();
  const N=brazil?contracts.length:Math.min(contracts.length,12);   // Brazil: list every F contract
  const defVis=brazil?new Set([0,1,2,3].filter(i=>i<N)):null;
  const datasets=seriesDatasets(mk,contracts,dates,N,mode,roll,defVis);
  c.innerHTML='<div class="card"><div class="card-hd"><div class="t">'+esc(MARKET_LABELS[S.active]||S.active)+
    '<small>Open-Interest '+(isPct?'relative change':'levels')+' · '+
      // say what the lines really are: stitched per contract, or generic (Treasuries = front contract per tenor)
      (/treas|tnote|tbond/i.test(S.active)?'generic front contract per tenor'
        :roll.stitch?'contract-wise (not generic)':(sinceRoll?'since last roll '+fmtDateShort(sinceRoll):'generic'))+'</small></div></div>'+
    '<div class="series-tools"><div class="seg small" id="ser-mode">'+
      '<button data-m="pct"'+(isPct?' class="active"':'')+'>% Change</button>'+
      '<button data-m="level"'+(!isPct?' class="active"':'')+'>Levels</button></div>'+
      '<label>'+(isPct?'Each contract indexed to the start of the window (0%)':'Absolute open interest, in contracts')+'</label>'+
      '<div class="player"><button class="btn-play" id="ser-play" title="Replay">▶</button>'+
      '<input type="range" id="ser-scrub" min="0" max="'+(labels.length-1)+'" value="'+(labels.length-1)+'" aria-label="Replay date">'+
      '<span class="scrub-date" id="ser-date">'+esc(fmtDateLong(labels[labels.length-1]||''))+'</span></div>'+
    '</div>'+
    '<div class="chart-box"><canvas id="ser"></canvas></div><div class="ser-legend" id="ser-legend"></div></div>';
  const ctx=$('#ser').getContext('2d');
  const fmtVal=v=>isPct?fmtPct0(v):fmtOI(v);
  const chart=new Chart(ctx,{type:'line',data:{labels,datasets},plugins:[crosshairPlugin,endLabelPlugin],options:{
    responsive:true,maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    layout:{padding:{top:8,right:endLabelWidth(datasets,fmtVal),bottom:2,left:2}},
    elements:{line:{borderJoinStyle:'round',capBezierPoints:true}},
    plugins:{
      endLabels:{fmt:fmtVal},
      legend:{display:false},   // HTML legend below (#ser-legend) — values update with the replay without reflowing
      tooltip:{enabled:true,backgroundColor:'rgba(23,35,59,.97)',titleColor:'#fff',bodyColor:'#dbe6f5',
        borderColor:'#31456a',borderWidth:1,padding:{top:10,bottom:10,left:12,right:12},
        cornerRadius:8,titleFont:{size:12,weight:'700'},bodyFont:{size:11.5},boxPadding:5,
        usePointStyle:true,itemSort:(a,b)=>b.parsed.y-a.parsed.y,
        callbacks:{title:(items)=>items.length?fmtDateLong(items[0].label):'',
          label:(x)=>'  '+x.dataset.label+'   '+(isPct?fmtPct0(x.parsed.y):fmtOI(x.parsed.y))}}
    },
    scales:{
      x:{grid:{display:false},border:{color:'#c7cfdb'},
        ticks:{color:'#7b8aa1',font:{size:10.5},maxTicksLimit:9,autoSkip:true,maxRotation:0,
          callback(v){return fmtDateShort(this.getLabelForValue(v));}}},
      y:{grace:isPct?'6%':'8%',
        grid:{color:(cx)=>(isPct&&cx.tick&&cx.tick.value===0)?'#9aa8bd':'#eaedf3',
              lineWidth:(cx)=>(isPct&&cx.tick&&cx.tick.value===0)?1.4:1},
        border:{display:false},
        title:{display:true,text:isPct?'Change since start of window (%)':'Open Interest (contracts)',color:'#7b8aa1',font:{size:10.5,weight:'700'}},
        ticks:{color:'#7b8aa1',font:{size:10.5},padding:6,callback:v=>isPct?((v>0?'+':'')+v+'%'):fmtOI(v)}}
    }
  }});
  S.charts.push(chart);
  const mb=document.querySelector('#ser-mode');
  if(mb) mb.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.seriesMode=b.dataset.m;render();});
  buildSeriesLegend(chart,fmtVal);
  wireReplay(chart,labels);
}

// HTML legend: click toggles a line (remembered per market); each value sits in a fixed-width slot,
// so it updates in sync with the replay while nothing on the board moves
function buildSeriesLegend(chart,fmt){
  const box=$('#ser-legend'); if(!box) return;
  const dss=chart.data.datasets;
  let w=1; dss.forEach(ds=>ds.data.forEach(v=>{ if(v!=null) w=Math.max(w,fmt(v).length); }));
  box.innerHTML=dss.map((ds,j)=>'<button type="button" class="lg-item"><i style="background:'+ds.borderColor+'"></i>'+
    '<span class="lg-name">'+esc(ds.label)+'</span><span class="lg-val" style="width:'+(w+0.5)+'ch"></span></button>').join('');
  const items=[...box.children];
  const update=()=>items.forEach((el,j)=>{
    el.classList.toggle('off',!chart.isDatasetVisible(j));
    const v=lastVal(dss[j].data); el.lastChild.textContent=v==null?'·':fmt(v);
  });
  items.forEach((el,j)=>el.onclick=()=>{
    chart.setDatasetVisibility(j,!chart.isDatasetVisible(j));
    S.seriesVis[S.active]=dss.filter((ds,i)=>chart.isDatasetVisible(i)).map(ds=>ds.label);
    if(chart.$relock) chart.$relock(); else chart.update('none');
    update();
  });
  chart.$legendUpdate=update; update();
}

// replay: ▶ draws every visible line day by day (≈6 s); the slider scrubs to any date
function wireReplay(chart,labels){
  const full=chart.data.datasets.map(ds=>ds.data.slice()), last=labels.length-1;
  chart.data.datasets.forEach((ds,j)=>{ ds.$full=full[j]; });
  const btn=$('#ser-play'), scrub=$('#ser-scrub'), dateEl=$('#ser-date');
  if(!btn||last<1) return;
  // y-axis always spans the FULL visible series (suggested bounds keep ticks round), so the frame,
  // axis labels and plot area stay put while lines draw in — only the lines and end labels move
  const fitY=()=>{
    let mn=Infinity,mx=-Infinity;
    full.forEach((arr,j)=>{ if(chart.isDatasetVisible(j)) arr.forEach(v=>{ if(v!=null){ mn=Math.min(mn,v); mx=Math.max(mx,v); } }); });
    const y=chart.options.scales.y;
    y.suggestedMin=mn<=mx?mn:undefined; y.suggestedMax=mn<=mx?mx:undefined;
  };
  fitY(); chart.update('none');
  chart.$relock=()=>{ fitY(); chart.update('none'); };   // legend toggle changes which lines set the range
  const showUpTo=k=>{
    chart.data.datasets.forEach((ds,j)=>{ ds.data=full[j].map((v,t)=>t<=k?v:null); });
    scrub.value=k; dateEl.textContent=fmtDateLong(labels[k]);
    chart.update('none');
    chart.$legendUpdate?.();
  };
  const stop=()=>{ clearInterval(S.playTimer); S.playTimer=null; btn.textContent='▶'; btn.classList.remove('on'); };
  btn.onclick=()=>{
    if(S.playTimer){ stop(); return; }
    let k=(+scrub.value>=last)?0:+scrub.value;   // from the start, or resume where paused
    btn.textContent='❚❚'; btn.classList.add('on');
    S.playTimer=setInterval(()=>{ showUpTo(k); if(++k>last) stop(); }, Math.max(25,Math.round(6000/labels.length)));
  };
  scrub.oninput=()=>{ if(S.playTimer) stop(); showUpTo(+scrub.value); };
}

/* ============================ PRE vs FINAL ============================ */
async function renderPvf(c){
  c.innerHTML='<div class="card"><div class="loading">Loading pre-vs-final snapshot…</div></div>';
  const p=await ensurePvf();
  // compare only matching days: current upload must be Final, and the Pre snapshot must be for that same date
  const cur=S.meta||{}, preDate=(p&&!p.error)?p.pre?.snapshot_date:null;
  const pvfMkts=S.order.filter(m=>/sr3|ff|treas|tnote|tbond|ultra/i.test(m)).map(m=>m==='treasuries'?'Treasuries':m).join(' · ');
  const notice=(title,body)=>'<div class="card"><div class="card-hd"><div class="t">Pre vs Final Open Interest'+
    '<small>USA only · settlement revision</small></div></div><div class="pvf-wait"><div class="w1">'+title+'</div><div class="w2">'+body+'</div></div></div>';
  if(!cur.isFinal){
    c.innerHTML=notice('Waiting for Final OI for <b>'+esc(cur.latest||'—')+'</b>',
      '<b>Pre OI</b> for '+esc(cur.latest||'—')+' is live — published <b>'+esc(fmtUpdated(cur.updated))+'</b> · '+esc(pvfMkts)+'.<br>'+
      'The comparison appears here automatically once the <b>Final OI</b> file for the same date is published '+
      '<span class="w3">(usually after 9:00 PM IST · ~11:30 AM ET)</span>.');
    return;
  }
  if(preDate!==cur.latest){
    c.innerHTML=notice('No matching Pre OI for <b>'+esc(cur.latest||'—')+'</b>',
      '<b>Final OI</b> for '+esc(cur.latest||'—')+' is published, but '+
      (preDate?'the last Pre snapshot is for <b>'+esc(preDate)+'</b>':'no Pre snapshot was captured')+', so there is nothing to compare.<br>'+
      'Publish the <b>Pre OI</b> file for a date first, then its <b>Final OI</b> file.');
    return;
  }
  const order=p.market_order||[];
  const pre=p.pre?.markets||{}, fin=p.final?.markets||{};
  let h='<div class="card"><div class="card-hd"><div class="t">Pre vs Final Open Interest'+
        '<small>USA only · settlement revision</small></div>'+
        '<div class="pvf-actions"><button class="btn btn-ghost" id="pvf-png" title="Copy the table as an image">⧉ Copy PNG</button></div></div>';
  // one table per market, side by side; one sort shared by all of them (Contract restores curve order)
  const sortTh=(key,label)=>{ const on=!!S.pvfSort&&S.pvfSort.key===key;
    return '<th class="sortable'+(on?' sorted':'')+'" data-psort="'+key+'">'+label+'<span class="arw">'+(on?(S.pvfSort.dir==='asc'?'▲':'▼'):'')+'</span></th>'; };
  h+='<div class="pvf-cols">';
  order.forEach(m=>{
    h+='<div class="pvf-col"><table class="grid"><thead>'+
       '<tr><th class="grp pvf-mkt" colspan="5">'+esc(MARKET_LABELS[m]||m)+'</th></tr>'+
       '<tr><th class="lbl sortable" data-psort="" title="Curve order">Contract<span class="arw"></span></th>'+
       sortTh('pre','Pre OI')+sortTh('final','Final OI')+sortTh('delta','Δ')+sortTh('pct','Δ&nbsp;%')+'</tr></thead><tbody>';
    const rows=pvfRows(m,pre,fin), t=pvfTotal(rows);
    const row=(cls,lbl,r)=>{ const dc=r.d>0?'up':(r.d<0?'down':'flat');
      return '<tr'+(cls?' class="'+cls+'"':'')+'><td class="lbl">'+esc(lbl)+'</td>'+
        '<td class="num">'+fmtOI(r.a)+'</td><td class="num">'+fmtOI(r.b)+'</td>'+
        '<td class="num '+dc+'">'+fmtSigned(r.d)+'</td><td class="num '+dc+'">'+(r.pc===null?'·':fmtPctNum(r.pc))+'</td></tr>'; };
    rows.forEach(r=>{ h+=row('',r.ct,r); });
    h+=row('total','TOTAL',t);   // net sum, always last whatever the sort
    h+='</tbody></table></div>';
  });
  h+='</div>';
  h+='<div class="pvf-note">Pre snapshot: <b>'+esc(p.pre?.snapshot_date||'—')+'</b> · Final snapshot: <b>'+esc(p.final?.snapshot_date||'—')+'</b>. '+
     'Positive Δ = OI added between the pre and final prints · click a column header to sort ▼/▲ · <b>Contract</b> resets.</div></div>';
  c.innerHTML=h;
  c.querySelectorAll('th[data-psort]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.psort, cur=S.pvfSort;   // cycle: descending → ascending → curve order
    if(!k || (cur && cur.key===k && cur.dir==='asc')) S.pvfSort=null;
    else S.pvfSort={key:k, dir:(cur && cur.key===k)?'asc':'desc'};
    render();
  });
  $('#pvf-png').onclick=()=>exportPvfPng(p,order,pre,fin);
}

// rows for one market: curve order from the live contract list (snapshot keys arrive alphabetical), then the shared sort
function pvfRows(m,pre,fin){
  const live=S.markets[m]?.contracts||[], seen=new Set(live), names=[...live];
  [...Object.keys(pre[m]||{}),...Object.keys(fin[m]||{})].forEach(ct=>{ if(!seen.has(ct)){ seen.add(ct); names.push(ct); } });
  const has=ct=>(pre[m]&&ct in pre[m])||(fin[m]&&ct in fin[m]);
  const rows=names.filter(has).map((ct,ri)=>{
    const a=pre[m]?.[ct]??null, b=fin[m]?.[ct]??null;
    return {ct,ri,a,b,d:(a!=null&&b!=null)?b-a:null,pc:pct(b,a)};
  });
  const s=S.pvfSort;
  if(s){
    const f={pre:'a',final:'b',delta:'d',pct:'pc'}[s.key], sgn=s.dir==='asc'?1:-1;
    rows.sort((x,y)=>{ const va=x[f],vb=y[f];
      if(va==null) return vb==null?x.ri-y.ri:1;
      if(vb==null) return -1;
      return (va-vb)*sgn||x.ri-y.ri; });
  }
  return rows;
}

// a market's TOTAL row: net sums; Δ and Δ % use only contracts present in both prints
function pvfTotal(rows){
  let a=null,b=null,d=null,base=0;
  rows.forEach(r=>{
    if(r.a!=null) a=(a||0)+r.a;
    if(r.b!=null) b=(b||0)+r.b;
    if(r.d!=null){ d=(d||0)+r.d; base+=r.a; }
  });
  return {a,b,d,pc:(d!=null&&base!==0)?d/Math.abs(base)*100:null};
}

function flash(sel,txt){const b=$(sel);const o=b.textContent;b.textContent=txt;setTimeout(()=>b.textContent=o,1400);}

// PNG mirrors the page: markets side by side, same row order (curve or current sort)
function exportPvfPng(p,order,pre,fin){
  const cols=order.map(m=>({m,rows:pvfRows(m,pre,fin)}));
  const padX=16, gap=16, colW=420, titleH=58, mktH=26, thH=24, rowH=22, sc=2;
  const W=padX*2+cols.length*colW+(cols.length-1)*gap;
  const H=titleH+14+mktH+thH+(Math.max(0,...cols.map(c=>c.rows.length))+1)*rowH+18;   // +1: TOTAL row
  const cv=document.createElement('canvas'); cv.width=W*sc; cv.height=H*sc;
  const x=cv.getContext('2d'); x.scale(sc,sc);
  x.fillStyle='#ffffff'; x.fillRect(0,0,W,H);
  x.fillStyle='#1b2c47'; x.fillRect(0,0,W,titleH);
  x.fillStyle='#eaf1fb'; x.font='800 18px Inter,Segoe UI,system-ui,sans-serif';
  x.fillText('OI PROFILE — PRE vs FINAL',padX,26);
  const s=S.pvfSort, sortTxt=s?'   ·   sorted by '+{pre:'Pre OI',final:'Final OI',delta:'Δ',pct:'Δ %'}[s.key]+(s.dir==='asc'?' ▲':' ▼'):'';
  x.fillStyle='#8fb0d8'; x.font='italic 11px Inter,Segoe UI,system-ui,sans-serif';
  x.fillText('Pre '+(p.pre?.snapshot_date||'—')+'   ·   Final '+(p.final?.snapshot_date||'—')+sortTxt,padX,44);
  const right=[190,280,360,410];   // right edges of Pre, Final, Δ, Δ% within a column
  cols.forEach((col,ci)=>{
    const x0=padX+ci*(colW+gap); let y=titleH+14;
    x.fillStyle='#41597f'; x.fillRect(x0,y,colW,mktH);
    x.fillStyle='#eaf1fb'; x.font='800 10.5px Inter,Segoe UI,system-ui,sans-serif'; x.textAlign='left';
    x.fillText((MARKET_LABELS[col.m]||col.m).toUpperCase(),x0+10,y+17); y+=mktH;
    x.fillStyle='#e9edf3'; x.fillRect(x0,y,colW,thH);
    x.fillStyle='#43536e'; x.font='700 10px Inter,Segoe UI,system-ui,sans-serif';
    x.fillText('CONTRACT',x0+10,y+16); x.textAlign='right';
    ['PRE','FINAL','Δ','Δ %'].forEach((t,i)=>x.fillText(t,x0+right[i],y+16)); x.textAlign='left'; y+=thH;
    col.rows.forEach((r,i)=>{
      if(i%2){ x.fillStyle='#f4f6fa'; x.fillRect(x0,y,colW,rowH); }
      x.fillStyle='#17233b'; x.font='700 11px Inter,sans-serif'; x.fillText(shortName(r.ct),x0+10,y+15);
      x.font='11px "SF Mono",Roboto Mono,Consolas,monospace'; x.textAlign='right';
      x.fillStyle='#43536e'; x.fillText(fmtOI(r.a),x0+right[0],y+15); x.fillText(fmtOI(r.b),x0+right[1],y+15);
      x.fillStyle=r.d>0?'#1f9d6b':(r.d<0?'#cf3f38':'#7b8aa1');
      x.fillText(fmtSigned(r.d),x0+right[2],y+15);
      x.fillText(r.pc===null?'·':fmtPctNum(r.pc),x0+right[3],y+15);
      x.textAlign='left'; y+=rowH;
    });
    const t=pvfTotal(col.rows);   // TOTAL row
    x.fillStyle='#e4e9f1'; x.fillRect(x0,y,colW,rowH);
    x.strokeStyle='#9fb0c8'; x.lineWidth=2; x.beginPath(); x.moveTo(x0,y+1); x.lineTo(x0+colW,y+1); x.stroke();
    x.fillStyle='#1b2c47'; x.font='800 11px Inter,sans-serif'; x.fillText('TOTAL',x0+10,y+15);
    x.font='700 11px "SF Mono",Roboto Mono,Consolas,monospace'; x.textAlign='right';
    x.fillText(fmtOI(t.a),x0+right[0],y+15); x.fillText(fmtOI(t.b),x0+right[1],y+15);
    x.fillStyle=t.d>0?'#1f9d6b':(t.d<0?'#cf3f38':'#7b8aa1');
    x.fillText(fmtSigned(t.d),x0+right[2],y+15);
    x.fillText(t.pc===null?'·':fmtPctNum(t.pc),x0+right[3],y+15); x.textAlign='left';
    x.strokeStyle='#d7dce5'; x.lineWidth=1; x.strokeRect(x0+.5,titleH+14.5,colW-1,mktH+thH+(col.rows.length+1)*rowH-1);
  });
  // copy the image to the clipboard (paste straight into chat / email); download only if the browser refuses
  const blobP=new Promise(res=>cv.toBlob(res,'image/png'));
  const download=()=>blobP.then(bl=>{const u=URL.createObjectURL(bl);const a=document.createElement('a');
    a.href=u;a.download='OI_pre_vs_final_'+(p.final?.snapshot_date||'').replace(/\//g,'-')+'.png';a.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000); flash('#pvf-png','✓ Saved');});
  if(navigator.clipboard?.write && typeof ClipboardItem!=='undefined'){
    // ClipboardItem gets the promise directly, so the write stays inside the click (required by Safari)
    navigator.clipboard.write([new ClipboardItem({'image/png':blobP})])
      .then(()=>flash('#pvf-png','✓ Copied'))
      .catch(download);
  } else download();
}
