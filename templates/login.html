<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OI Admin — Login</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#10161f; --panel:#181f2d; --panel2:#1c2438;
  --border:#2e3f58; --border2:#3a5070;
  --accent:#4db8ff; --accent2:#50e890;
  --text:#ffffff; --dim:#7a95b8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:var(--bg); color:var(--text);
  font-family:'IBM Plex Sans', sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  -webkit-font-smoothing:antialiased;
}
.card {
  background:var(--panel); border:1px solid var(--border);
  padding:44px 48px; width:360px;
}
.logo {
  font-family:'IBM Plex Mono', monospace;
  font-size:16px; font-weight:600; color:var(--accent);
  letter-spacing:2px; margin-bottom:6px;
}
.subtitle {
  font-family:'IBM Plex Mono', monospace;
  font-size:10px; color:var(--dim); letter-spacing:1.5px;
  margin-bottom:32px;
}
label {
  display:block; font-family:'IBM Plex Mono', monospace;
  font-size:10px; color:var(--dim); letter-spacing:1.5px;
  margin-bottom:8px;
}
input[type=password] {
  width:100%; background:var(--panel2); border:1px solid var(--border2);
  color:var(--text); padding:10px 12px;
  font-family:'IBM Plex Mono', monospace; font-size:13px;
  outline:none; margin-bottom:20px; border-radius:2px;
}
input[type=password]:focus { border-color:var(--accent); }
.btn {
  width:100%; padding:10px; border:1px solid var(--accent);
  background:transparent; color:var(--accent);
  font-family:'IBM Plex Mono', monospace; font-weight:600;
  font-size:13px; cursor:pointer; letter-spacing:1px;
  transition:.15s; border-radius:2px;
}
.btn:hover { background:var(--accent); color:#0d1420; }
.error {
  background:rgba(180,30,50,.15); border:1px solid rgba(180,30,50,.4);
  color:#ff8080; padding:8px 12px; margin-bottom:18px;
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  border-radius:2px;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">OI PROFILE</div>
  <div class="subtitle">ADMIN ACCESS</div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <label>PASSWORD</label>
    <input type="password" name="password" autofocus autocomplete="current-password">
    <button class="btn" type="submit">SIGN IN →</button>
  </form>
</div>
</body>
</html>
