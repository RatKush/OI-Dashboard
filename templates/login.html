<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · OI Profile</title>
<style>
:root{--navy:#1b2c47;--navy2:#26436c;--ink:#17233b;--muted:#7b8aa1;--line:#d7dce5;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#12203a 0%,#1b2c47 45%,#26436c 100%);
  font-family:var(--sans);color:var(--ink);padding:20px}
.card{background:#fff;width:100%;max-width:380px;border-radius:14px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.35)}
.head{background:linear-gradient(100deg,var(--navy),var(--navy2));color:#fff;padding:26px 28px 22px}
.head h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.head p{margin:6px 0 0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8fb0d8}
.body{padding:26px 28px 30px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px}
input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;
  font-family:var(--sans);font-size:14px;color:var(--ink);outline:none;transition:.15s}
input[type=password]:focus{border-color:#2f6fb0;box-shadow:0 0 0 3px rgba(47,111,176,.15)}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;cursor:pointer;
  background:var(--navy);color:#fff;font-family:var(--sans);font-weight:700;font-size:13px;
  letter-spacing:.1em;text-transform:uppercase;transition:.15s}
button:hover{background:#26436c}
.err{margin-top:16px;background:#fdeeec;border:1px solid #f3c7c2;color:#cf3f38;
  padding:10px 12px;border-radius:8px;font-size:12.5px;font-weight:600}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:20px}
</style>
</head>
<body>
  <div class="card">
    <div class="head"><h1>OI&nbsp;Profile</h1><p>Admin&nbsp;Access</p></div>
    <div class="body">
      <form method="POST" action="{{ url_for('admin_login') }}">
        <label for="pw">Password</label>
        <input id="pw" type="password" name="password" autofocus autocomplete="current-password" placeholder="••••••••••">
        <button type="submit">Sign in</button>
        {% if error %}<div class="err">{{ error }}</div>{% endif %}
      </form>
      <div class="foot">Authorised users only</div>
    </div>
  </div>
</body>
</html>
