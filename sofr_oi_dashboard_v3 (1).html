<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OI Profile</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root {
  /* Lighter, readable dark theme — not pitch black */
  --bg:      #10161f;
  --panel:   #181f2d;
  --panel2:  #1c2438;
  --panel3:  #202840;
  --border:  #2e3f58;
  --border2: #3a5070;
  --accent:  #4db8ff;
  --accent2: #50e890;
  --text:    #ffffff;          /* pure white for all numbers & labels */
  --text2:   #dce8f8;          /* slightly softer white for secondary */
  --dim:     #7a95b8;          /* readable muted — not too dark */
  --dim2:    #9ab0cc;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans', sans-serif;
  font-size:14px;
  font-weight:400;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

.app { position:relative; }

/* ─── HEADER ─── */
header {
  display:flex; align-items:center; gap:18px; padding:12px 22px;
  background:#141b28;
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100;
  flex-wrap:wrap;
}
.logo {
  font-family:'IBM Plex Mono', monospace;
  font-size:16px; font-weight:600;
  color:var(--accent); letter-spacing:2px; white-space:nowrap;
}
.hdr-meta { display:flex; gap:24px; align-items:center; }
.hdr-stat {
  display:flex; flex-direction:column;
  font-family:'IBM Plex Mono', monospace;
  font-size:10px; color:var(--dim); line-height:1.5;
}
.hdr-stat b { color:var(--text); font-size:13px; font-weight:600; }
.hdr-file {
  display:flex; gap:8px; align-items:center;
  margin-left:auto; flex:1; max-width:500px;
}
.hdr-file-label {
  color:var(--dim); font-size:11px;
  font-family:'IBM Plex Mono', monospace; white-space:nowrap;
}
.fpath {
  flex:1; background:var(--panel2); border:1px solid var(--border2);
  color:var(--text); padding:6px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:12px;
  outline:none; min-width:0; border-radius:2px;
}
.fpath:focus { border-color:var(--accent); }
.fbtn {
  padding:6px 14px; background:transparent;
  border:1px solid var(--accent); color:var(--accent);
  cursor:pointer; font-size:12px; white-space:nowrap;
  font-family:'IBM Plex Mono', monospace; border-radius:2px;
  transition:.15s;
}
.fbtn:hover { background:rgba(77,184,255,.12); }
#fi { display:none; }
.hdr-right { display:flex; gap:10px; align-items:center; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--border2); flex-shrink:0; transition:.3s; }
.dot.live { background:var(--accent2); box-shadow:0 0 8px var(--accent2); animation:pulse 2s infinite; }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.btn {
  padding:7px 18px; border:1px solid var(--accent); background:transparent;
  color:var(--accent); font-family:'IBM Plex Sans',sans-serif;
  font-weight:600; font-size:13px; cursor:pointer; letter-spacing:.5px;
  transition:.15s; border-radius:2px;
}
.btn:hover { background:var(--accent); color:#0d1420; }
.btn.g { border-color:var(--accent2); color:var(--accent2); }
.btn.g:hover { background:var(--accent2); color:#0d1420; }

/* ─── MARKET TABS ─── */
.mkt-tabs {
  display:flex; padding:8px 22px 0;
  border-bottom:1px solid var(--border);
  overflow-x:auto; scrollbar-width:none; background:var(--panel);
}
.mkt-tabs::-webkit-scrollbar { display:none; }
.tab {
  padding:8px 24px; background:transparent;
  border:1px solid transparent; border-bottom:none;
  color:var(--dim2); font-family:'IBM Plex Sans',sans-serif;
  font-weight:600; font-size:13px; cursor:pointer; letter-spacing:.3px;
  transition:.12s; white-space:nowrap; flex-shrink:0;
}
.tab:hover { color:var(--text); }
.tab.active {
  color:var(--accent); border-color:var(--border);
  background:var(--bg); margin-bottom:-1px;
  border-bottom:1px solid var(--bg);
}

/* ─── VIEW TOGGLE ─── */
.vtoggle {
  display:none; gap:8px; align-items:center;
  padding:9px 22px; border-bottom:1px solid var(--border);
  background:var(--panel2);
}
.vtab {
  padding:5px 18px; border:1px solid var(--border2);
  background:transparent; color:var(--dim2);
  font-family:'IBM Plex Sans',sans-serif; font-weight:600;
  font-size:12px; cursor:pointer; letter-spacing:.3px;
  transition:.12s; border-radius:2px;
}
.vtab.active { border-color:var(--accent); color:var(--accent); background:rgba(77,184,255,.07); }
.vtab:hover:not(.active) { color:var(--text); border-color:var(--dim); }
.vtog-label { color:var(--dim); font-size:11px; font-family:'IBM Plex Mono',monospace; }

/* ─── MAIN ─── */
.main { padding:14px 18px; }

/* ─── EMPTY ─── */
.empty {
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height:320px; gap:14px; color:var(--dim);
  font-family:'IBM Plex Mono',monospace; font-size:13px;
}
.empty-icon { font-size:42px; opacity:.25; }

/* ══════════════════════════════════════════════════════
   HEATMAP LAYOUT
   col: [Contract 170px] | [OI 105px] | [gap] | [6 pct cells] | [gap] | [Contract 170px] | [6 abs cells]
══════════════════════════════════════════════════════ */

/* COLUMN HEADER */
:root {
  --hm-name-col: 170px;
  --hm-oi-col: 105px;
  --hm-gap: 14px;
  --hm-cell: 86px;
  --hm-grid-cols: var(--hm-name-col) var(--hm-oi-col) var(--hm-gap) repeat(6, var(--hm-cell)) var(--hm-gap) var(--hm-name-col) repeat(6, var(--hm-cell));
}

.main { overflow-x:auto; }

.hm-col-header {
  display:grid;
  grid-template-columns: var(--hm-grid-cols);
  grid-template-rows: auto auto;
  width:max-content;
  margin-left:auto;
  margin-right:auto;
  border:1px solid var(--border); background:var(--panel3);
  margin-bottom:3px;
}
.hm-ch-lbl {
  padding:7px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  color:var(--dim2); letter-spacing:.5px;
  display:flex; flex-direction:column; justify-content:flex-end;
  border-right:1px solid var(--border);
}
.hm-ch-oi {
  padding:7px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  color:var(--dim2); letter-spacing:.5px;
  display:flex; flex-direction:column; justify-content:flex-end;
  border-right:1px solid var(--border);
}
.hm-ch-gap { background:var(--bg); grid-row:1 / span 2; }
.hm-ch-side-title {
  padding:4px 8px; font-size:10px; color:var(--accent);
  letter-spacing:1px; text-transform:uppercase;
  border-bottom:1px solid var(--border);
  font-family:'IBM Plex Mono', monospace; font-weight:500;
  text-align:center;
  border-right:1px solid var(--border);
}
.hm-ch-col {
  padding:4px 6px; text-align:right;
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  color:var(--dim2); border-right:1px solid rgba(46,63,88,.5);
  grid-row:2;
}
.hm-ch-col:last-child { border-right:none; }

/* PACK BLOCK */
.pack-block {
  border:1px solid var(--border); background:var(--panel);
  margin:0 auto 4px; overflow:hidden; width:max-content;
}
.pack-hdr {
  display:grid;
  grid-template-columns: var(--hm-grid-cols);
  border-bottom:1px solid var(--border);
  min-height:34px;
}
.pack-label {
  display:flex; align-items:center; gap:6px; padding:6px 10px;
  border-right:1px solid var(--border);
}
.pack-oi-cell {
  display:flex; align-items:center; justify-content:flex-end; padding:6px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600;
  color:var(--text); border-right:1px solid var(--border);
}
.pack-name {
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  font-weight:700; letter-spacing:2.4px;
}
.pack-gap { background:var(--bg); border-left:1px solid var(--border); border-right:1px solid var(--border); }

/* CONTRACT ROWS */
.contract-row {
  display:grid;
  grid-template-columns: var(--hm-grid-cols);
  border-top:1px solid rgba(46,63,88,.6);
  min-height:32px;
}
.contract-row:hover { background:rgba(77,184,255,.04); }
.c-label {
  display:flex; align-items:center; padding:4px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  font-weight:500; color:var(--text2);
  letter-spacing:.7px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  border-right:1px solid var(--border);
}
.c-oi-cell {
  display:flex; align-items:center; justify-content:flex-end; padding:4px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:500;
  color:var(--text); border-right:1px solid var(--border);
}
.c-gap { background:var(--bg); border-left:1px solid var(--border); border-right:1px solid var(--border); }

/* DATA CELLS */
.cell {
  display:flex; align-items:center; justify-content:flex-end;
  padding:4px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:500;
  color:#ffffff;
  border-right:1px solid rgba(46,63,88,.4); white-space:nowrap;
}
.cell:last-child { border-right:none; }

/* GRAND TOTAL */
.grand-block {
  border:1px solid rgba(77,184,255,.35);
  background:rgba(77,184,255,.05); margin:6px auto 0; overflow:hidden; width:max-content;
}
.grand-hdr {
  display:grid;
  grid-template-columns: var(--hm-grid-cols);
  min-height:38px;
}
.grand-label {
  display:flex; align-items:center; padding:6px 10px;
  border-right:1px solid rgba(77,184,255,.2);
}
.grand-oi-cell {
  display:flex; align-items:center; justify-content:flex-end; padding:6px 10px;
  font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:700;
  color:var(--accent); border-right:1px solid rgba(77,184,255,.2);
}
.grand-name {
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  color:var(--accent); letter-spacing:1.7px;
}
.grand-gap { background:var(--bg); border-left:1px solid rgba(77,184,255,.2); border-right:1px solid rgba(77,184,255,.2); }
.grand-cell {
  display:flex; align-items:center; justify-content:flex-end;
  padding:6px 8px;
  font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:700;
  color:#ffffff;
  border-right:1px solid rgba(77,184,255,.12);
}
.grand-cell:last-child { border-right:none; }

/* ─── SERIES VIEW ─── */
.series-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.s-card {
  background:var(--panel); border:1px solid var(--border);
  padding:14px 14px 10px; border-radius:2px;
}
.s-card-title {
  font-family:'IBM Plex Mono', monospace;
  font-size:13px; color:var(--text); font-weight:600;
  letter-spacing:.5px; margin-bottom:10px;
}
.s-label {
  margin-bottom:6px; margin-top:20px;
  font-family:'IBM Plex Mono', monospace; font-size:10px;
  color:var(--dim2); letter-spacing:1.5px; text-transform:uppercase;
}

/* ─── LOADING ─── */
#lo {
  display:none; position:fixed; inset:0;
  background:rgba(16,22,31,.88); z-index:999;
  flex-direction:column; align-items:center; justify-content:center; gap:14px;
}
#lo.show { display:flex; }
.spin {
  width:38px; height:38px; border:2px solid var(--border);
  border-top-color:var(--accent); border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.lo-msg {
  font-family:'IBM Plex Mono', monospace; font-size:12px;
  color:var(--accent); letter-spacing:2px;
}

/* ─── TOOLTIP ─── */
#tip {
  position:fixed; background:#1a2438; border:1px solid var(--accent);
  color:var(--text); padding:7px 12px;
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  pointer-events:none; z-index:200; display:none; line-height:1.9;
  border-radius:2px; box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.spark-tip-title {
  color:var(--accent);
  font-weight:600;
  letter-spacing:.8px;
  margin-bottom:4px;
}
.spark-tip-canvas {
  display:block;
  width:240px;
  height:92px;
}

@media(max-width:1100px){ .series-grid{ grid-template-columns:repeat(3,1fr); } }
@media(max-width:800px){ .series-grid{ grid-template-columns:repeat(2,1fr); } }
@media(max-width:500px){ .series-grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app">
<div id="lo"><div class="spin"></div><div class="lo-msg">PARSING OI DATA…</div></div>
<div id="tip"></div>

<header>
  <div class="logo">OI PROFILE</div>
  <div class="hdr-meta">
    <div class="hdr-stat"><span>LATEST</span><b id="hdrDate">—</b></div>
    <div class="hdr-stat"><span>MARKETS</span><b id="hdrMkts">—</b></div>
    <div class="hdr-stat"><span>CONTRACTS</span><b id="hdrCtrs">—</b></div>
  </div>
  <div class="hdr-file">
    <span class="hdr-file-label">PATH:</span>
    <input class="fpath" id="fpath" type="text" value="C:\data\sofr_oi.xlsx" placeholder="Excel file path…">
    <label class="fbtn" for="fi">📂 BROWSE</label>
    <input type="file" id="fi" accept=".xlsx,.xls" onchange="handleFile(event)">
  </div>
  <div class="hdr-right">
    <div class="dot" id="dot"></div>
    <button class="btn g" onclick="loadData()">⟳ REFRESH</button>
  </div>
</header>

<div class="mkt-tabs" id="mktTabs"></div>

<div class="vtoggle" id="vtog">
  <span class="vtog-label">VIEW:</span>
  <button class="vtab active" onclick="switchView('heatmap',this)">⬛ HEATMAP</button>
  <button class="vtab" onclick="switchView('series',this)">📈 SERIES</button>
</div>

<div class="main" id="mc">
  <div class="empty">
    <div class="empty-icon">[OI]</div>
    <div>LOAD AN EXCEL WORKBOOK TO BEGIN</div>
    <button class="btn g" style="margin-top:8px" onclick="document.getElementById('fi').click()">📂 BROWSE FILE</button>
  </div>
</div>
</div>

<script>
// ── STATE ──
const S = { markets:{}, active:null, view:'heatmap', charts:{} };

// SOFR-style packs with color accents
const SOFR_PACKS = [
  { name:'WHITES',  start:0,  end:3,  sideColor:'#b8c8dc', sideText:'#101820' },
  { name:'REDS',    start:4,  end:7,  sideColor:'#c83050', sideText:'#ffe0e8' },
  { name:'GREENS',  start:8,  end:11, sideColor:'#1e7848', sideText:'#b0f0c8' },
  { name:'BLUES',   start:12, end:15, sideColor:'#1e50a0', sideText:'#b0d0ff' },
  { name:'GOLDS',   start:16, end:19, sideColor:'#a07800', sideText:'#ffe080' },
  { name:'PURPLES', start:20, end:23, sideColor:'#6030a0', sideText:'#e0b8ff' },
  { name:'ORANGES', start:24, end:27, sideColor:'#c05010', sideText:'#ffc080' },
];

const TREAS_PACKS = [
  { name:'2 YR',  start:0,  end:0,  sideColor:'#1e50a0', sideText:'#b0d0ff' },
  { name:'5 YR',  start:1,  end:1,  sideColor:'#1e7848', sideText:'#b0f0c8' },
  { name:'10 YR', start:2,  end:3,  sideColor:'#a07800', sideText:'#ffe080' },
  { name:'30 YR', start:4,  end:5,  sideColor:'#882040', sideText:'#ffc0d8' },
];

const TREAS_KEYWORDS = ['treas','tnote','tbond','zn','zb','zt','zf','ultra'];

function packsForMarket(name) {
  const lc = name.toLowerCase();
  if (TREAS_KEYWORDS.some(k => lc.includes(k))) return TREAS_PACKS;
  return SOFR_PACKS;
}

const DIFFS = [
  { label:'1D',  i:1  },
  { label:'2D',  i:2  },
  { label:'3D',  i:3  },
  { label:'5D',  i:5  },
  { label:'11D', i:11 },
  { label:'21D', i:21 },
];

const LINE_COLORS = [
  '#4db8ff','#50e890','#ffd44d','#ff6b6b',
  '#b088ff','#ff9f50','#40ddb0','#ff80c0','#80b8ff'
];

const nearestCrosshair = {
  id:'nearestCrosshair',
  afterDraw(chart) {
    const active = chart.tooltip && chart.tooltip.getActiveElements ? chart.tooltip.getActiveElements() : [];
    if (!active.length) return;
    const el = active[0].element;
    if (!el) return;
    const {ctx, chartArea} = chart;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(el.x, chartArea.top);
    ctx.lineTo(el.x, chartArea.bottom);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(220,232,248,.65)';
    ctx.setLineDash([3,3]);
    ctx.stroke();
    ctx.restore();
  }
};

Chart.register(nearestCrosshair);

// ── FILE ──
function handleFile(e) {
  const f = e.target.files[0]; if (!f) return;
  document.getElementById('fpath').value = f.name;
  readFile(f);
}
function loadData() {
  const fi = document.getElementById('fi');
  if (fi.files && fi.files[0]) readFile(fi.files[0]); else fi.click();
}
function readFile(f) {
  loading(true);
  const r = new FileReader();
  r.onload = e => { try { parseWB(XLSX.read(e.target.result,{type:'binary',cellDates:false})); } catch(err) { alert('Parse error: '+err.message); loading(false); } };
  r.readAsBinaryString(f);
}

// ── PARSE ──
function excelSerialToDate(serial) {
  const days = serial > 59 ? serial - 1 : serial;
  const ms = (days - 1) * 86400000;
  const d = new Date(Date.UTC(1899, 11, 31) + ms);
  const dy = String(d.getUTCDate()).padStart(2,'0');
  const mo = String(d.getUTCMonth()+1).padStart(2,'0');
  const yy = String(d.getUTCFullYear()).slice(-2);
  return `${dy}/${mo}/${yy}`;
}

// Convert any date string to dd/mm/yy
function toDisplayDate(v) {
  if (typeof v === 'number') {
    if (v > 10000 && v < 80000) return excelSerialToDate(v);
    return String(v);
  }
  const s = String(v).trim();
  // Try YYYY-MM-DD
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return `${m[3]}/${m[2]}/${m[1].slice(-2)}`;
  return s;
}

function parseWB(wb) {
  S.markets = {};
  let globalLatest = null;

  wb.SheetNames.forEach(sn => {
    if (sn.endsWith('_0')) return;
    const ws = wb.Sheets[sn];
    let raw = XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    if (!raw || raw.length < 3) return;

    raw = raw.map(row => { if (!row||!row.length) return row; const r=[...row]; r.splice(1,1); return r; });

    const headerRow = raw.findIndex(r =>
    r &&r[0] &&String(r[0]).trim().toLowerCase() === 'dates'
    );
    if (headerRow === -1) return;
    const hdr = raw[headerRow] || [];

    const dates = [];
    for (let c = 1; c < hdr.length; c++) {
      const v = hdr[c];
      if (v === null || v === undefined || v === '') continue;
      const ds = toDisplayDate(v);
      if (ds) dates.push(ds);
    }
    if (!dates.length) return;

    if (!globalLatest || dates[0] > globalLatest) globalLatest = dates[0];

    const contracts = [], data = {};
    for (let r = headerRow + 1; r < raw.length; r++) {
      const row = raw[r];
      if (!row || row[0]==null || String(row[0]).trim()==='') continue;
      const c = String(row[0]).trim();
      contracts.push(c);
      data[c] = {};
      for (let ci = 0; ci < dates.length; ci++) {
        const v = row[ci+1];
        data[c][dates[ci]] = (v!==null&&v!==undefined&&v!=='') ? Number(v) : null;
      }
    }
    if (!contracts.length) return;
    S.markets[sn] = { contracts, dates, data };
  });

  const mkts = Object.keys(S.markets);
  if (!mkts.length) { alert('No valid sheets found.'); loading(false); return; }

  S.active = mkts[0];
  document.getElementById('hdrDate').textContent = globalLatest || '—';
  document.getElementById('hdrMkts').textContent = mkts.length;
  document.getElementById('hdrCtrs').textContent = Object.values(S.markets).reduce((s,m)=>s+m.contracts.length,0);

  buildTabs();
  document.getElementById('vtog').style.display = 'flex';
  render();
  document.getElementById('dot').classList.add('live');
  loading(false);
}

// ── TABS ──
function buildTabs() {
  const el = document.getElementById('mktTabs');
  el.innerHTML = '';
  Object.keys(S.markets).forEach(n => {
    const b = document.createElement('button');
    b.className = 'tab'+(n===S.active?' active':'');
    b.textContent = n;
    b.onclick = () => { S.active=n; el.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); b.classList.add('active'); render(); };
    el.appendChild(b);
  });
}

function switchView(v,el) {
  S.view=v;
  document.querySelectorAll('.vtab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ── RENDER ──
function render() {
  killCharts();
  const mc = document.getElementById('mc');
  mc.innerHTML = '';
  if (!S.active) return;
  S.view==='heatmap' ? renderHeatmap(mc) : renderSeries(mc);
}
function killCharts() { Object.values(S.charts).forEach(c=>c.destroy()); S.charts={}; }

// ════════════════════════════════════════════
// HEATMAP — columns: OI Label | OI Value | gap | % Label | 6×pct | gap | Abs Label | 6×abs
// ════════════════════════════════════════════
function renderHeatmap(mc) {
  const mkt = S.markets[S.active];
  const { contracts, dates, data } = mkt;
  const d0 = dates[0];
  const packs = packsForMarket(S.active);

  // Grand totals
  const grandByDate = {};
  dates.forEach(d => { grandByDate[d] = contracts.reduce((s,c)=>s+(data[c][d]||0),0); });

  // ── Column header ──
  const colHdr = document.createElement('div');
  colHdr.className = 'hm-col-header';
  colHdr.innerHTML = `
    <div class="hm-ch-lbl" style="grid-column:1;grid-row:1 / span 2">CONTRACT</div>
    <div class="hm-ch-oi" style="grid-column:2;grid-row:1 / span 2">LATEST OI</div>
    <div class="hm-ch-gap" style="grid-column:3"></div>
    <div class="hm-ch-side-title" style="grid-column:4 / span 6;grid-row:1">% CHANGE FROM LATEST &nbsp;[%]</div>
    ${DIFFS.map((d,i)=>`<div class="hm-ch-col" style="grid-column:${4+i}">${d.label}</div>`).join('')}
    <div class="hm-ch-gap" style="grid-column:10"></div>
    <div class="hm-ch-lbl" style="grid-column:11;grid-row:1 / span 2">CONTRACT</div>
    <div class="hm-ch-side-title" style="grid-column:12 / span 6;grid-row:1">ABSOLUTE DELTA</div>
    ${DIFFS.map((d,i)=>`<div class="hm-ch-col" style="grid-column:${12+i}">${d.label}</div>`).join('')}`;
  mc.appendChild(colHdr);

  // ── Pack blocks ──
  packs.forEach(pack => {
    const pContracts = contracts.slice(pack.start, pack.end+1);
    if (!pContracts.length) return;

    const packOI = {};
    dates.forEach(d => { packOI[d] = pContracts.reduce((s,c)=>s+(data[c][d]||0),0); });

    const sc = pack.sideColor;
    const st = pack.sideText;

    const block = document.createElement('div');
    block.className = 'pack-block';

    // Pack header
    const pHdr = document.createElement('div');
    pHdr.className = 'pack-hdr';
    pHdr.style.background = `${sc}22`;
    pHdr.innerHTML = `
      <div class="pack-label" style="background:${sc};border-right:1px solid ${sc}">
        <span class="pack-name" style="color:${st}">${pack.name}</span>
      </div>
      <div class="pack-oi-cell">${fmtOI(packOI[d0])}</div>
      <div class="pack-gap"></div>
      ${DIFFS.map(df=>cellHTML(packOI[d0],packOI[dates[df.i]],'pct',true)).join('')}
      <div class="pack-gap"></div>
      <div class="pack-label" style="background:${sc};border-right:1px solid ${sc}">
        <span class="pack-name" style="color:${st}">${pack.name}</span>
      </div>
      ${DIFFS.map(df=>cellHTML(packOI[d0],packOI[dates[df.i]],'abs',true)).join('')}`;
    block.appendChild(pHdr);

    // Contract rows
    pContracts.forEach(c => {
      const row = document.createElement('div');
      row.className = 'contract-row';
      const oi0 = data[c][d0];
      row.innerHTML = `
        <div class="c-label" style="border-left:3px solid ${sc}">${c}</div>
        <div class="c-oi-cell">${fmtOI(oi0)}</div>
        <div class="c-gap"></div>
        ${DIFFS.map(df=>cellHTML(oi0,dates[df.i]?data[c][dates[df.i]]:null,'pct',false)).join('')}
        <div class="c-gap"></div>
        <div class="c-label" style="border-left:3px solid ${sc}">${c}</div>
        ${DIFFS.map(df=>cellHTML(oi0,dates[df.i]?data[c][dates[df.i]]:null,'abs',false)).join('')}`;
      row.addEventListener('mouseover', e=>showTip(e,c,data[c],dates));
      row.addEventListener('mousemove', moveTip);
      row.addEventListener('mouseout', hideTip);
      block.appendChild(row);
    });

    mc.appendChild(block);
  });

  // ── Grand total ──
  const gb = document.createElement('div');
  gb.className = 'grand-block';
  gb.innerHTML = `
    <div class="grand-hdr">
      <div class="grand-label"><span class="grand-name">GROSS TOTAL</span></div>
      <div class="grand-oi-cell">${fmtOI(grandByDate[d0])}</div>
      <div class="grand-gap"></div>
      ${DIFFS.map(df=>grandCell(grandByDate[d0],grandByDate[dates[df.i]],'pct')).join('')}
      <div class="grand-gap"></div>
      <div class="grand-label"><span class="grand-name">GROSS TOTAL</span></div>
      ${DIFFS.map(df=>grandCell(grandByDate[d0],grandByDate[dates[df.i]],'abs')).join('')}
    </div>`;
  mc.appendChild(gb);
}

// Cell — white text always, background tint for direction only
function cellHTML(lat, prev, mode, isHeader) {
  const cls = 'cell' + (isHeader ? ' pack-cell' : '');
  if (lat==null || prev==null) return `<div class="${cls}" style="color:#5a7a9a">—</div>`;
  const delta = lat - prev;
  const pct   = prev!==0 ? (delta/prev)*100 : 0;
  const val   = mode==='pct' ? pct : delta;
  const pos   = val>0, neg=val<0;
  const ref   = mode==='pct' ? Math.abs(pct) : (lat ? Math.abs(delta/lat)*100 : 0);
  const inten = Math.min(ref,20)/20;
  // Pure color backgrounds, white text always
  const bg = pos
    ? `rgba(30,150,70,${0.15 + inten*0.45})`
    : neg
    ? `rgba(180,30,50,${0.15 + inten*0.45})`
    : 'transparent';
  const txt = mode==='pct'
    ? (pos?'+':'')+pct.toFixed(0)
    : (pos?'+':'')+fmt(delta);
  return `<div class="${cls}" style="background:${bg};color:#ffffff">${txt}</div>`;
}

function grandCell(lat, prev, mode) {
  if (lat==null||prev==null) return `<div class="grand-cell" style="color:#5a7a9a">—</div>`;
  const delta = lat-prev;
  const pct   = prev!==0?(delta/prev)*100:0;
  const val   = mode==='pct'?pct:delta;
  const pos   = val>0, neg=val<0;
  const ref   = mode==='pct'?Math.abs(pct):(lat?Math.abs(delta/lat)*100:0);
  const inten = Math.min(ref,20)/20;
  const bg = pos
    ? `rgba(30,150,70,${0.15+inten*0.5})`
    : neg
    ? `rgba(180,30,50,${0.15+inten*0.5})`
    : 'transparent';
  const txt = mode==='pct'?(pos?'+':'')+pct.toFixed(0):(pos?'+':'')+fmt(delta);
  return `<div class="grand-cell" style="background:${bg};color:#ffffff">${txt}</div>`;
}

// ════════════════════════════════════════════
// SERIES VIEW — 12 contracts, +20% taller charts
// ════════════════════════════════════════════
function renderSeries(mc) {
  const mkt = S.markets[S.active];
  const { contracts, dates, data } = mkt;
  const top12 = contracts.slice(0,12);   // 12 instead of 9
  const ordDates = [...dates].reverse();

  const lbl = document.createElement('div');
  lbl.className = 's-label';
  lbl.textContent = 'OI TIME SERIES — FIRST 12 CONTRACTS';
  mc.appendChild(lbl);

  const grid = document.createElement('div');
  grid.className = 'series-grid';

  top12.forEach((c,i) => {
    const color = LINE_COLORS[i % LINE_COLORS.length];
    const card = document.createElement('div');
    card.className = 's-card';
    card.innerHTML = `<div class="s-card-title" style="color:${color}">${c}</div>`;
    const cv = document.createElement('canvas');
    card.appendChild(cv);
    grid.appendChild(card);

    setTimeout(() => {
      const chartH = 216; // 180 * 1.2 = +20%
      cv.parentElement.style.height = chartH+'px';
      cv.style.height = chartH+'px';
      const chart = new Chart(cv.getContext('2d'), {
        type:'line',
        data:{
          labels:ordDates,
          datasets:[{
            data: ordDates.map(d=>data[c][d]??null),
            borderColor:color,
            backgroundColor: hexAlpha(color,.10),
            borderWidth:2, pointRadius:0, pointHoverRadius:4,
            fill:true, tension:.3, spanGaps:true,
          }]
        },
        options:{
          responsive:true, maintainAspectRatio:false, animation:{duration:300},
          interaction:{mode:'nearest',axis:'x',intersect:false},
          plugins:{
            legend:{display:false},
            tooltip:{
              backgroundColor:'#1a2438', borderColor:'#3a5070', borderWidth:1,
              titleColor:color, bodyColor:'#dce8f8',
              displayColors:false,
              titleFont:{family:"'IBM Plex Mono',monospace",size:10},
              bodyFont:{family:"'IBM Plex Mono',monospace",size:11},
              callbacks:{title:ctx=>'Date: '+formatTooltipDate(ctx[0].label), label:ctx=>'OI: '+fmtOI(ctx.raw)}
            }
          },
          scales:{
            x:{ticks:{color:'#7a95b8',font:{family:"'IBM Plex Mono',monospace",size:9},maxTicksLimit:6,maxRotation:0},grid:{color:'#1e2d40'}},
            y:{ticks:{color:'#7a95b8',font:{family:"'IBM Plex Mono',monospace",size:9},callback:v=>fmtOI(v)},grid:{color:'#1e2d40'}}
          }
        }
      });
      chart.resize();
      S.charts[c] = chart;
    },0);
  });

  mc.appendChild(grid);

  // Aggregate overlay
  const lbl2 = document.createElement('div');
  lbl2.className = 's-label';
  lbl2.style.marginTop='22px';
  lbl2.textContent = 'AGGREGATE OVERLAY — TOP 12';
  mc.appendChild(lbl2);

  const aggCard = document.createElement('div');
  aggCard.className = 's-card';
  const aggCv = document.createElement('canvas');
  aggCard.appendChild(aggCv);
  mc.appendChild(aggCard);

  setTimeout(() => {
    const totalSeries = top12.length;
    const ds = top12.map((c,i)=>({
      label:c,
      data:ordDates.map(d=>data[c][d]??null),

      hidden: (() => {
        if (totalSeries >= 8) {return !(i % 2 === 0 && i<8);} // alternate visibility
        const altVisible = Math.ceil(totalSeries / 2); // Small overlays
        const extraNeeded = Math.max(0, 4 - altVisible);
        if (i % 2 === 0) return false; // Alternate-visible series
        return !( // Turn on earliest hidden series additionally
          i % 2 === 1 &&
          i <= (extraNeeded * 2 - 1)
        );
      })(),

      borderColor:LINE_COLORS[i % LINE_COLORS.length],
      backgroundColor:'transparent',
      borderWidth:1.4, pointRadius:0, pointHoverRadius:3,
      fill:false, tension:.3, spanGaps:true,
    }));
    const aggH = 600; // 240 * 1.2
    const chart = new Chart(aggCv.getContext('2d'),{
      type:'line',
      data:{labels:ordDates,datasets:ds},
      options:{
        responsive:true, maintainAspectRatio:false, animation:{duration:500},
        interaction:{mode:'nearest',axis:'x',intersect:false},
        plugins:{
          legend:{display:true,labels:{color:'#9ab0cc',font:{family:"'IBM Plex Mono',monospace",size:10},boxWidth:10,padding:12}},
          tooltip:{backgroundColor:'#1a2438',borderColor:'#3a5070',borderWidth:1,titleColor:'#7a95b8',bodyColor:'#dce8f8',
            displayColors:false,
            titleFont:{family:"'IBM Plex Mono',monospace",size:10},bodyFont:{family:"'IBM Plex Mono',monospace",size:11},
            callbacks:{title:ctx=>'Date: '+formatTooltipDate(ctx[0].label), label:ctx=>ctx.dataset.label+' OI: '+fmtOI(ctx.raw)}}
        },
        scales:{
          x:{ticks:{color:'#7a95b8',font:{family:"'IBM Plex Mono',monospace",size:9},maxTicksLimit:8,maxRotation:0},grid:{color:'#1e2d40'}},
          y:{ticks:{color:'#7a95b8',font:{family:"'IBM Plex Mono',monospace",size:9},callback:v=>fmtOI(v)},grid:{color:'#1e2d40'}}
        }
      }
    });
    aggCv.parentElement.style.height = aggH+'px';
    aggCv.style.height = aggH+'px';
    chart.resize();
    S.charts['__agg__'] = chart;
  },0);
}

// ── TOOLTIP ──
function showTip(e,contract,cData,dates) {
  const t=document.getElementById('tip');
  t.innerHTML = `
    <div class="spark-tip-title">${contract}</div>
    <canvas class="spark-tip-canvas" width="240" height="92"></canvas>`;
  t.style.display='block';
  drawSparkline(t.querySelector('canvas'), dates, cData);
  moveTip(e);
  return;
  let h=`<b style="color:var(--accent)">${contract}</b><br>`;
  dates.slice(0,6).forEach((d,i)=>{ h+=`${i===0?'★ ':'  '}${d}: <b>${fmtOI(cData[d])}</b><br>`; });
  t.innerHTML=h; t.style.display='block';
}
function moveTip(e) {
  const t=document.getElementById('tip');
  const x = Math.min(e.clientX + 16, window.innerWidth - t.offsetWidth - 12);
  const y = Math.min(e.clientY + 12, window.innerHeight - t.offsetHeight - 12);
  t.style.left = Math.max(12, x) + 'px';
  t.style.top = Math.max(12, y) + 'px';
}
function hideTip() { document.getElementById('tip').style.display='none'; }

// ── FORMAT ──
function drawSparkline(canvas, dates, cData) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const pad = { left:8, right:8, top:8, bottom:16 };
  const points = dates
    .map(d => ({ d, v:Number(cData[d]) }))
    .filter(p => Number.isFinite(p.v))
    .reverse();

  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#10161f';
  ctx.fillRect(0,0,w,h);

  ctx.strokeStyle = 'rgba(122,149,184,.18)';
  ctx.lineWidth = 1;
  for (let i=0; i<3; i++) {
    const y = pad.top + i * ((h - pad.top - pad.bottom) / 2);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
  }

  if (points.length < 2) {
    ctx.fillStyle = '#7a95b8';
    ctx.font = '11px IBM Plex Mono, monospace';
    ctx.fillText('NO SERIES', 86, 50);
    return;
  }

  const vals = points.map(p => p.v);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 1; max += 1; }
  const xFor = i => pad.left + i * ((w - pad.left - pad.right) / (points.length - 1));
  const yFor = v => pad.top + (max - v) * ((h - pad.top - pad.bottom) / (max - min));

  const grad = ctx.createLinearGradient(0,pad.top,0,h-pad.bottom);
  grad.addColorStop(0,'rgba(77,184,255,.25)');
  grad.addColorStop(1,'rgba(77,184,255,0)');

  ctx.beginPath();
  points.forEach((p,i) => {
    const x = xFor(i), y = yFor(p.v);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.lineTo(xFor(points.length-1), h-pad.bottom);
  ctx.lineTo(xFor(0), h-pad.bottom);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  points.forEach((p,i) => {
    const x = xFor(i), y = yFor(p.v);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = '#4db8ff';
  ctx.lineWidth = 2;
  ctx.stroke();

  const last = points[points.length - 1];
  const lx = xFor(points.length - 1), ly = yFor(last.v);
  ctx.fillStyle = '#50e890';
  ctx.beginPath();
  ctx.arc(lx, ly, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#7a95b8';
  ctx.font = '10px IBM Plex Mono, monospace';
  ctx.fillText(formatTooltipDate(points[0].d), pad.left, h - 4);
  const endLabel = formatTooltipDate(last.d);
  const endW = ctx.measureText(endLabel).width;
  ctx.fillText(endLabel, w - pad.right - endW, h - 4);
}

function fmtOI(v) {
  if (v==null||isNaN(v)) return '—';
  const a=Math.abs(v);
  if (a>=1e6) return (v/1e6).toFixed(2)+'M';
  if (a>=1e3) return (v/1e3).toFixed(1)+'K';
  return String(Math.round(v));
}
function fmt(v) {
  if (v==null||isNaN(v)) return '—';
  const a=Math.abs(v);
  if (a>=1e6) return (v/1e6).toFixed(2)+'M';
  if (a>=1e3) return (v/1e3).toFixed(1)+'K';
  return String(Math.round(v));
}
function formatTooltipDate(v) {
  const s = String(v || '').trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (!m) return s;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const day = m[1].padStart(2,'0');
  const month = months[Math.max(0, Math.min(11, Number(m[2]) - 1))];
  const year = m[3].slice(-2);
  return `${day}/${month}/${year}`;
}
function hexAlpha(hex,a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function loading(b) { document.getElementById('lo').classList.toggle('show',b); }
